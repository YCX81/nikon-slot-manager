<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Nikon 滤镜槽管理器 · Nikon Slot Manager</title>
  <style>*{box-sizing:border-box}
:root{
  --ink:#232726;--muted:#707774;--paper:#f5f4ef;--line:#dddfd8;
  --orange:#bf4e2c;--orange-soft:#f9ece6;--green:#325e49;--green-soft:#ebf3ed;
  --white:#fffefa;--err:#b73521;--err-soft:#fdebe8;
  --gutter:clamp(14px,1.8vw,32px);
  --maxw:100%;
}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;display:flex;flex-direction:column;
  background:var(--paper);color:var(--ink);
  font:13.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
}
button,input,select{font:inherit}
button,label.file-btn,label.drop-btn{cursor:pointer}
button:disabled,input:disabled,select:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #da9c7a;outline-offset:1px}

header{
  width:100%;max-width:var(--maxw);margin:0 auto;flex-shrink:0;
  padding:clamp(9px,1.1vh,15px) var(--gutter);min-height:56px;
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap;
}
.brand{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.mark{font:700 14px/30px Georgia,serif;background:var(--ink);color:var(--paper);padding:0 8px;border-radius:5px;letter-spacing:.5px;user-select:none}
.mark span{color:#ee9475;font:10px sans-serif;margin-left:2px;vertical-align:middle}
.brand-text strong{font-size:clamp(14.5px,1vw,17px);letter-spacing:.2px;display:block;line-height:1.2}
.brand-text small{display:block;color:var(--muted);font-size:clamp(11px,0.75vw,12.5px)}

.card-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--white);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.card-pill .dot{width:7px;height:7px;border-radius:50%;background:#b6bbb5;flex-shrink:0}
.card-pill.rw{border-color:#adc8b6;background:var(--green-soft);color:var(--green);font-weight:600}
.card-pill.rw .dot{background:var(--green);box-shadow:0 0 0 3px #325e491f}
.card-pill.ro{border-color:#dcc4a7;background:#fbf3e9;color:#7a4b26;font-weight:600}
.card-pill.ro .dot{background:#d4822a}

.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--white);color:var(--ink);padding:6px 12px;border-radius:6px;font-size:clamp(12px,0.8vw,13px);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){background:#f1f0ea;border-color:#c6c9c0}
.btn.primary{background:var(--ink);color:var(--white);border-color:var(--ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);background:var(--ink)}
.btn.accent{background:var(--orange);color:var(--white);border-color:var(--orange);font-weight:600}
.btn.accent:hover:not(:disabled){filter:brightness(1.08);background:var(--orange)}
.btn.danger{border-color:#e2b5ad;background:var(--err-soft);color:var(--err)}
.btn.danger:hover:not(:disabled){background:#fadad4}
.btn.sm{padding:4px 10px;font-size:clamp(11.5px,0.78vw,12.5px);border-radius:5px;height:clamp(29px,2.8vh,34px)}

.lang-switch{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--white);height:clamp(29px,2.8vh,34px)}
.lang-opt{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:0 10px;font-weight:500}
.lang-opt+.lang-opt{border-left:1px solid var(--line)}
.lang-opt.active{background:var(--ink);color:var(--white)}

.file-btn,.drop-btn{position:relative;overflow:hidden}
.file-btn input,.drop-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

main{
  width:100%;max-width:var(--maxw);margin:0 auto;flex:1;min-height:0;
  padding:clamp(12px,1.5vh,22px) var(--gutter) clamp(14px,1.8vh,24px);
  display:flex;flex-direction:column;
}
.workspace{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) clamp(320px,24vw,460px);
  gap:clamp(14px,1.5vw,24px);
  align-items:stretch;
}
.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .15s}
.panel.panel-drag{border-color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange-soft),0 0 0 2px #bf4e2c26}

/* Left Panel */
.slots-panel{padding:clamp(12px,1.3vw,20px);display:flex;flex-direction:column;min-height:0}
.toolbar-row{position:relative;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-height:36px;padding-bottom:clamp(10px,1.1vh,14px);margin-bottom:clamp(10px,1.1vh,14px);border-bottom:1px solid var(--line);flex-shrink:0}
.tb-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0;flex:1}
.tb-right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}

/* Zero-layout-shift slim progress bar embedded along toolbar bottom edge */
.progress-track{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#e8e6de;border-radius:2px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .22s ease}
.progress-track.active{opacity:1}
.progress-fill{height:100%;width:0%;border-radius:2px;background:linear-gradient(90deg,var(--orange),#e57c55,var(--orange));background-size:200% 100%;transition:width .16s ease-out,background-color .2s;animation:prog-shimmer 1.05s linear infinite}
.progress-track.done .progress-fill{background:var(--green);animation:none}
.progress-track.err .progress-fill{background:var(--err);animation:none}
@keyframes prog-shimmer{0%{background-position:200% 0}100%{background-position:0 0}}
@keyframes spin-ring{to{transform:rotate(360deg)}}
@keyframes slot-pop{0%{background:var(--orange-soft);border-color:var(--orange);transform:scale(.97)}100%{background:var(--card-bg);border-color:#c6d8cb;transform:scale(1)}}

.btn.is-busy{opacity:.92!important;cursor:progress!important}
.btn.is-busy::before{content:"";width:11px;height:11px;border-radius:50%;border:1.8px solid rgba(255,255,255,.38);border-top-color:#fff;animation:spin-ring .65s linear infinite;flex-shrink:0}

.seg-tabs{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#f4f3ee;height:clamp(29px,2.8vh,34px)}
.seg-btn{border:0;background:transparent;padding:0 12px;font-size:clamp(12px,0.8vw,13px);color:var(--muted);font-weight:550}
.seg-btn.active{background:var(--ink);color:var(--white)}

.sync-check{display:inline-flex;align-items:center;gap:5px;font-size:clamp(11.5px,0.78vw,12.5px);color:var(--ink);cursor:pointer;user-select:none;white-space:nowrap}
.sync-check input{accent-color:var(--orange);cursor:pointer;margin:0}

.usage-badge{font:600 clamp(11px,0.75vw,12px) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);background:#f3f2ec;border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.status-inline{display:inline-flex;align-items:center;gap:6px;font-size:clamp(11.5px,0.78vw,12.5px);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:clamp(220px,30vw,680px)}
.status-inline.busy{color:var(--orange);font-weight:550}
.status-inline.busy::before{content:"";width:11px;height:11px;border-radius:50%;border:1.8px solid #e7c2b3;border-top-color:var(--orange);animation:spin-ring .65s linear infinite;flex-shrink:0}
.status-inline.ok{color:var(--green);font-weight:550}
.status-inline.error{color:var(--err);font-weight:550}

/* Viewport-Adaptive 5x11 Slot Matrix (scales cleanly from 720p laptop to 4K monitor) */
.slot-grid{
  flex:1;min-height:0;
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  grid-auto-rows:clamp(36px,calc((100dvh - 290px) / 11),94px);
  gap:clamp(6px,0.9vh,14px) clamp(6px,0.7vw,14px);
  align-content:start;
  overflow-y:auto;
}
.slot-card{
  --card-bg:var(--white);
  height:100%;min-height:36px;padding:0 clamp(8px,0.75vw,14px);
  border:1px solid var(--line);border-radius:clamp(6px,0.5vw,8px);
  background:var(--card-bg);display:flex;align-items:center;gap:clamp(6px,0.55vw,10px);
  position:relative;overflow:hidden;cursor:pointer;
  transition:border-color .12s,background .12s,box-shadow .12s;
}
.slot-card:hover{border-color:#aeb4ad}
.slot-card.occupied{--card-bg:#f9fcf9;border-color:#c6d8cb}
.slot-card.just-filled{animation:slot-pop .32s ease-out}
.slot-card.empty{--card-bg:#faf9f4;border-style:dashed;border-color:#d4d7ce}
.slot-card.active-cam{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.slot-card.focused{--card-bg:#fff8f5;border-color:var(--orange);box-shadow:0 0 0 1px var(--orange)}
.slot-card.drag-over{--card-bg:var(--orange-soft);border-color:var(--orange);border-style:solid}
.slot-card.locked{opacity:.42;background:repeating-linear-gradient(-45deg,#f3f3ee,#f3f3ee 4px,#e8e9e3 4px,#e8e9e3 8px);cursor:default;pointer-events:none}

.sc-num{font:600 clamp(10.5px,0.78vw,13px) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);flex-shrink:0;letter-spacing:-.2px}
.slot-card.occupied .sc-num{color:var(--green)}
.slot-card.focused .sc-num{color:var(--orange)}
.active-dot{width:clamp(6px,0.45vw,8px);height:clamp(6px,0.45vw,8px);border-radius:50%;background:var(--green);flex-shrink:0}

.sc-name{flex:1;min-width:0;font:550 clamp(12px,0.88vw,14.5px) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-dash{flex:1;font-size:11.5px;color:#b2b8b2;user-select:none}

.sc-actions{
  position:absolute;right:clamp(4px,0.45vw,8px);top:0;bottom:0;
  display:flex;align-items:center;gap:3px;
  padding-left:20px;
  background:linear-gradient(90deg,transparent,var(--card-bg) 16px);
  opacity:0;pointer-events:none;transition:opacity .1s;
}
.slot-card:hover .sc-actions,.slot-card.focused .sc-actions,.slot-card:focus-within .sc-actions{opacity:1;pointer-events:auto}

.ic-btn{
  border:1px solid transparent;background:transparent;color:var(--muted);
  height:clamp(22px,2.2vh,28px);min-width:clamp(22px,2.2vh,28px);padding:0 5px;border-radius:4px;
  font-size:clamp(11px,0.8vw,13px);line-height:1;display:inline-flex;align-items:center;justify-content:center;
}
.ic-btn:hover{background:#ecebe3;color:var(--ink)}
.ic-btn.on{color:var(--green);font-weight:700}
.ic-btn.fill{color:var(--orange);background:var(--orange-soft);border-color:#e8c4b5;font-size:clamp(10.5px,0.75vw,12px);padding:0 7px;font-weight:600}
.ic-btn.fill:hover{background:var(--orange);color:var(--white);border-color:var(--orange)}
.ic-btn.del:hover{background:var(--err-soft);color:var(--err)}

.rename-row{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.rename-input{flex:1;min-width:0;height:clamp(24px,2.4vh,30px);padding:0 7px;border:1px solid var(--orange);border-radius:4px;font:clamp(11.5px,0.82vw,13.5px) ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;color:var(--ink)}

/* Quiet Left Panel Footer */
.panel-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:clamp(10px,1.1vh,14px);padding-top:clamp(9px,1vh,13px);border-top:1px solid #eceee7;font-size:clamp(11px,0.76vw,12px);color:var(--muted);flex-shrink:0}
.foot-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-pills{display:inline-flex;gap:4px}
.chip{border:1px solid var(--line);background:#f7f6f1;color:var(--muted);font-size:clamp(11px,0.75vw,12px);padding:2px 10px;border-radius:99px}
.chip.active{border-color:var(--ink);background:var(--ink);color:var(--white);font-weight:600}
.mini-select{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:clamp(11px,0.75vw,12px);padding:2px 8px;border-radius:5px;height:26px}

/* Right Adaptive Library Panel */
.lib-panel{padding:clamp(12px,1.3vw,18px);display:flex;flex-direction:column;gap:clamp(8px,1vh,12px);min-height:0}
.lib-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-shrink:0}
.lib-head h2{font-size:clamp(14px,0.95vw,16px);margin:0}
.target-hint{font-size:clamp(11px,0.78vw,12.5px);color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums}

.lib-filter-row{display:grid;grid-template-columns:minmax(130px,44%) minmax(0,1fr);gap:6px;flex-shrink:0}
.lib-filter-row select,.lib-filter-row input{height:clamp(30px,2.9vh,36px);padding:0 9px;border:1px solid var(--line);border-radius:6px;font-size:clamp(11.5px,0.8vw,12.5px);background:#fff;color:var(--ink);min-width:0}

.lib-list{flex:1;min-height:240px;max-height:calc(100dvh - 255px);overflow-y:auto;border:1px solid var(--line);border-radius:7px;background:var(--white)}
.lib-item{min-height:clamp(33px,3.2vh,42px);padding:4px 10px;border-bottom:1px solid #f0f1eb;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;transition:background .1s}
.lib-item:last-child{border-bottom:0}
.lib-item:hover{background:#f7f6f0}
.lib-item.active{background:var(--orange-soft)}
.lib-main{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.lib-title{font-size:clamp(12px,0.84vw,13.5px);font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in-cam-pill{font:600 10px ui-monospace,SFMono-Regular,Menlo,monospace;padding:1px 6px;border-radius:99px;background:var(--green-soft);color:var(--green);flex-shrink:0}

.lib-right{display:flex;align-items:center;flex-shrink:0}
.lib-camname{font:clamp(10.5px,0.74vw,12px) ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.lib-put{display:none;border:1px solid #e4bfb0;background:#fff8f5;color:var(--orange);font-size:clamp(10.5px,0.75vw,12px);font-weight:600;padding:2px 8px;border-radius:4px}
.lib-item:hover .lib-camname,.lib-item.active .lib-camname{display:none}
.lib-item:hover .lib-put,.lib-item.active .lib-put{display:inline-flex}
.lib-put:hover{background:var(--orange);color:var(--white);border-color:var(--orange)}

.lib-foot{display:flex;flex-direction:column;gap:7px;flex-shrink:0}
.drop-btn{min-height:clamp(32px,3.1vh,38px);padding:4px 10px;border:1px dashed #c4c9be;border-radius:6px;background:#faf9f4;display:flex;align-items:center;justify-content:center;font-size:clamp(11.5px,0.78vw,12.5px);color:var(--muted);transition:border-color .15s,background .15s,color .15s;text-align:center}
.drop-btn:hover,.drop-btn.drag{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.lib-actions{display:flex;gap:6px;align-items:center}

/* Lightweight Modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(30,34,33,.4);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:18px 20px;width:100%;max-width:380px;box-shadow:0 14px 36px rgba(0,0,0,.15)}
.modal h3{margin:0 0 6px;font-size:14.5px}
.modal p{margin:0 0 11px;font-size:12px;color:var(--muted);line-height:1.5}
.modal .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:11.5px;color:var(--muted)}
.modal select,.modal input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff;color:var(--ink)}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}

[hidden]{display:none!important}

/* Medium Laptops & Narrower Desktops */
@media(max-width:1280px){
  .workspace{grid-template-columns:minmax(0,1fr) clamp(290px,28vw,340px)}
  .slot-grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:clamp(36px,calc((100dvh - 290px) / 14),52px)}
}
/* Tablets / Split-Screen Windows */
@media(max-width:980px){
  body{min-height:auto;display:block}
  main{display:block;flex:none}
  .workspace{grid-template-columns:1fr;align-items:start}
  .slot-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:40px;overflow:visible}
  .lib-list{height:300px;max-height:none;flex:none}
}
/* Phones */
@media(max-width:640px){
  header,main{padding-left:12px;padding-right:12px}
  .slot-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:38px}
  .status-inline{max-width:100%;white-space:normal}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark">NK<span>■</span></span>
    <div class="brand-text">
      <strong data-i18n="brandTitle">Nikon 滤镜槽管理器</strong>
      <small data-i18n="brandSub">存储卡 FENESTRA 滤镜槽直接管理</small>
    </div>
    <span class="card-pill" id="cardStatePill"><span class="dot"></span><span id="cardStateText">离线编排</span></span>
  </div>

  <div class="header-right">
    <button type="button" class="btn primary" id="btnOpenCard" data-i18n="openCardBtn" title="选择存储卡内的 FENESTRA 文件夹（直连读写，不扫描 DCIM 照片目录）">📂 打开卡内 FENESTRA</button>
    <button type="button" class="btn accent" id="btnSaveCard" data-i18n="saveZipBtn">💾 保存到存储卡 (.zip)</button>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-opt active" id="langZh">中文</button>
      <button type="button" class="lang-opt" id="langEn">EN</button>
    </div>
  </div>
</header>

<main>
  <div class="workspace">
    <!-- Left Panel: Viewport-Adaptive Slot Matrix -->
    <section class="panel slots-panel" id="slotsPanel">
      <div class="toolbar-row">
        <div class="tb-left">
          <div class="seg-tabs" role="tablist">
            <button type="button" class="seg-btn active" id="tabBank0" data-i18n="bankPhotoTab">照片</button>
            <button type="button" class="seg-btn" id="tabBank1" data-i18n="bankVideoTab">视频</button>
          </div>
          <label class="sync-check">
            <input type="checkbox" id="syncBothBanks" checked>
            <span data-i18n="syncBothLbl">双通道同步</span>
          </label>
          <span class="usage-badge" id="slotUsageText">0 / 55</span>
          <span class="status-inline" id="statusMsg" role="status" aria-live="polite"></span>
        </div>

        <div class="tb-right">
          <button type="button" class="btn sm accent" id="btnQuickFill50" data-i18n="quick50Btn">⚡ 一键灌入全部预设</button>
          <label class="btn sm file-btn" title="可多选 .NP3 / .cube / .zip / .rec 文件批量导入">
            <span data-i18n="importFilesBtn">＋ 批量导入 .NP3</span>
            <input type="file" id="slotFilesInput" multiple>
          </label>
          <button type="button" class="btn sm" id="btnImportFolder" data-i18n="importFolderBtn" title="选择一个包含多个 .NP3 / .cube 文件的文件夹批量导入">📁 导入文件夹</button>
          <button type="button" class="btn sm danger" id="btnClearAllExt" hidden data-i18n="clearAllBtn">清空</button>
        </div>
        <div class="progress-track" id="progressTrack" aria-hidden="true"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="slot-grid" id="extSlotGrid"></div>

      <div class="panel-foot">
        <span class="foot-hint" data-i18n="dragTip">拖拽卡片可互换位置 · 双击名称改名 · 可直接拖入多个 .NP3 / .cube / .zip 或整个文件夹</span>
        <div class="foot-controls">
          <div class="filter-pills">
            <button type="button" class="chip active" data-sfilter="all" id="sfAll" data-i18n="sfAll">全部</button>
            <button type="button" class="chip" data-sfilter="occupied" id="sfOcc" data-i18n="sfOcc">已占用</button>
            <button type="button" class="chip" data-sfilter="empty" id="sfEmp" data-i18n="sfEmp">空闲</button>
          </div>
          <select id="slotLimitSelect" class="mini-select" title="Slot Capacity">
            <option value="64">C64 (C-10~C-64)</option>
            <option value="32">C32 (C-10~C-32)</option>
          </select>
        </div>
      </div>
    </section>

  function readRecordInfo(rec) {
    if (!rec || rec.length !== SC_RECORD) return { valid: false, name: '', baseId: 0 };
    const dv = new DataView(rec.buffer, rec.byteOffset, rec.byteLength);
    const valid = dv.getUint32(0, true) === 1;
    const name = valid ? readAscii19(rec, 0x10) : '';
    const baseId = valid ? dv.getUint16(0x120, true) : 0;
    return { valid, name, baseId };
  }

  function clampNotFF(v, lo, hi, allow) {
    if (v === 0xff || (allow && allow.includes(v))) return v;
    if (v < lo) return lo;
    if (v > hi) return hi;
    return v;
  }

  function extractNp3Name(bytes) {
    const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
    if (b.length < 24 || b.length > 4096 || b[0] !== 0x4e || b[1] !== 0x43 || b[2] !== 0x50 || b[3] !== 0x00) {
      throw new Error('无效的 .NP3 文件（缺少 NCP\\0 文件头或长度越界）。');
    }
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let off = 4;
    while (off < b.length) {
      if (off + 4 > b.length) break;
      const tag = dv.getUint32(off, false);
      if (tag === 0) break;
      if (off + 8 > b.length) throw new Error('NP3 TLV 长度截断。');
      const len = dv.getUint32(off + 4, false);
      off += 8;
      if (off + len > b.length) throw new Error('NP3 TLV 内容越界。');
      if (tag === 0x0200 && len === 20) {
        return readAscii19(b, off) || 'Custom NP3';
      }
      off += len;
    }
    return 'Custom NP3';
  }

  /**
   * Compile a raw Nikon .NP3 (0300 or 0310) into the exact 1024-byte SC_RECORD expected by Z8 C3.11.
   * Matches ARM64 routines 0x410ADC64 + 0x410DAC30 + 0x410AC6D0 + 0x410AF260 bit-for-bit.
   */
  function np3ToSlotRecord(np3Bytes, slot, bank, overrideName = null) {
    slotToIndex(slot, bank);
    const b = np3Bytes instanceof Uint8Array ? np3Bytes : new Uint8Array(np3Bytes);
    if (b.length < 24 || b.length > 4096 || b[0] !== 0x4e || b[1] !== 0x43 || b[2] !== 0x50 || b[3] !== 0x00) {
      throw new Error(`无效 .NP3 文件（长度 ${b.length} B 或文件头不是 NCP\\0）。`);
    }
    const dv = new DataView(b.buffer, b.byteOffset, b.byteLength);
    const S = new Uint8Array(0x80);
    const aux = new Uint8Array(0x242);
    let mask = 0;
    let off = 4;

    while (off < b.length) {
      if (off + 4 > b.length) throw new Error('NP3 TLV 标签截断。');
      const tag = dv.getUint32(off, false);
      if (tag === 0) break;
      if (off + 8 > b.length) throw new Error('NP3 TLV 长度字段截断。');
      const len = dv.getUint32(off + 4, false);
      off += 8;
      if (off + len > b.length) throw new Error('NP3 TLV 字段越界。');
      const val = b.subarray(off, off + len);

      if (tag === 1) {
        throw new Error('不支持的 NP3 标签 0x0001。');
      } else if (tag === 2) {
        if (len !== 0x242) throw new Error('NP3 色调曲线区块长度不是 578 B。');
        aux.set(val);
        for (let k = 0x40; k < 0x242; k += 2) {
          const t = aux[k];
          aux[k] = aux[k + 1];
          aux[k + 1] = t;
        }
      } else if (tag === 0x0100) {
        if (len !== 4) throw new Error('NP3 0x0100 版本字段长度错误。');
        mask = (mask | 1) >>> 0;
        S.set(val, 4);
      } else if (tag === 0x0200) {
        if (len !== 20) throw new Error('NP3 0x0200 名称字段长度错误。');
        mask = (mask | 2) >>> 0;
        S.set(val, 8);
      } else if (tag === 0x0300) {
        if (len !== 2) throw new Error('NP3 0x0300 基类字段长度错误。');
        mask = (mask | 4) >>> 0;
        const idBE = (val[0] << 8) | val[1];
        S[0x1c] = idBE & 0xff;
        S[0x1d] = (idBE >>> 8) & 0xff;
      } else if (tag === 0x0400) {
        if (len !== 2) throw new Error('NP3 0x0400 字段长度错误。');
        mask = (mask | 8) >>> 0;
        S[0x1e] = val[0];
        S[0x1f] = val[1];
      } else if (tag >= 0x0500 && tag <= 0x1600 && (tag & 0xff) === 0) {
        if (len !== 2) throw new Error(`NP3 标签 0x${tag.toString(16)} 长度错误。`);
        const idx = (tag >>> 8) - 5;
        mask = (mask | (1 << (idx + 4))) >>> 0;
        S[0x20 + idx * 2] = val[0];
        S[0x21 + idx * 2] = val[1];
      } else if (tag >= 0x1900 && tag <= 0x1e00 && (tag & 0xff) === 0) {
        if (len !== 2) throw new Error(`NP3 标签 0x${tag.toString(16)} 长度错误。`);
        const idx = (tag >>> 8) - 0x19;
        mask = (mask | (1 << (idx + 22))) >>> 0;
        S[0x44 + idx * 2] = val[0];
        S[0x45 + idx * 2] = val[1];
      } else if (tag === 0x1f00) {
        if (len !== 28) throw new Error('NP3 0x1F00 混色器字段长度错误。');
        mask = (mask | 0x10000000) >>> 0;
        S.set(val.subarray(0, 27), 0x50);
      } else if (tag === 0x2000) {
        if (len !== 20) throw new Error('NP3 0x2000 分级字段长度错误。');
        mask = (mask | 0x20000000) >>> 0;
        for (let i = 0; i < 3; i++) {
          const hue = (val[i * 4] << 8) | val[i * 4 + 1];
          S[0x6c + i * 4] = hue & 0xff;
          S[0x6d + i * 4] = (hue >>> 8) & 0xff;
          S[0x6e + i * 4] = val[i * 4 + 2];
          S[0x6f + i * 4] = val[i * 4 + 3];
        }
        S[0x78] = val[12];
        S[0x79] = 0;
        S[0x7a] = val[13];
        S[0x7b] = val[14];
        S[0x7c] = val[16];
        S[0x7d] = val[17];
        S[0x7e] = val[18];
        S[0x7f] = val[19];
      }
      off += len;
    }

    if ((mask & 0x3fffff) !== 0x3fffff) {
      throw new Error('NP3 缺少必要基础字段（0x0100..0x1600）。');
    }
    const ver = String.fromCharCode(S[4], S[5], S[6], S[7]);
    if (!ver.startsWith('03')) {
      throw new Error(`不支持的 NP3 版本号：${ver}`);
    }

    if (overrideName !== null) {
      const clean = validateAsciiCameraName(overrideName);
      S.fill(0, 8, 28);
      for (let i = 0; i < clean.length; i++) S[8 + i] = clean.charCodeAt(i);
    } else {
      for (let k = 8; k < 28; k++) {
        if (S[k] === 0) break;
        if (S[k] < 0x20 || S[k] > 0x7e) throw new Error('NP3 名称包含非 ASCII 字符。');
      }
    }

    const baseId = S[0x1c] | (S[0x1d] << 8);
    if (baseId === 0 || S[0x21] !== 1 || S[0x1e] > 2) {
      throw new Error('NP3 基类或参数头标记无效。');
    }

    S[0x20] = clampNotFF(S[0x20], 0x7e, 0x82);
    if (S[0x23] !== 4) throw new Error('NP3 参数标志无效 (0x23)。');
    S[0x22] = clampNotFF(S[0x22], 0x74, 0xa4, [0]);
    if (S[0x25] !== 4) throw new Error('NP3 参数标志无效 (0x25)。');
    S[0x24] = clampNotFF(S[0x24], 0x6c, 0x94, [0]);
    if (S[0x27] !== 4) throw new Error('NP3 参数标志无效 (0x27)。');
    S[0x26] = clampNotFF(S[0x26], 0x74, 0x8c, [0, 1]);
    if (S[0x29] !== 4) throw new Error('NP3 参数标志无效 (0x29)。');
    S[0x28] = clampNotFF(S[0x28], 0x7a, 0x86, [1]);
    if (S[0x2b] !== 4) throw new Error('NP3 参数标志无效 (0x2B)。');
    S[0x2a] = clampNotFF(S[0x2a], 0x74, 0x8c, [0]);
    if (S[0x2d] !== 4) throw new Error('NP3 参数标志无效 (0x2D)。');
    S[0x2c] = clampNotFF(S[0x2c], 0x74, 0x8c);
    if (S[0x2f] !== 0) throw new Error('NP3 参数标志无效 (0x2F)。');
    if (S[0x2e] !== 0xff && (S[0x2e] < 0x80 || S[0x2e] > 0x84)) S[0x2e] = 0x80;
    if (S[0x31] !== 0 || S[0x33] !== 4) throw new Error('NP3 参数标志无效 (0x31/0x33)。');
    if (S[0x30] !== 0xff && (S[0x30] < 0x80 || S[0x30] > 0x89)) {
      S[0x30] = 0x80;
      S[0x32] = 0xff;
    } else if (S[0x32] !== 0xff) {
      S[0x32] = clampNotFF(S[0x32], 0x80, 0x9c);
    }
    for (let k = 0x34; k < 0x3e; k += 2) {
      if (S[k + 1] !== 1) throw new Error(`NP3 参数标志无效 (0x${(k + 1).toString(16)})。`);
      S[k] = clampNotFF(S[k], 0x7e, 0x82);
    }
    if (S[0x41] !== 0x0a) throw new Error('NP3 参数标志无效 (0x41)。');
    if (S[0x40] !== 0xff) S[0x40] = clampNotFF(S[0x40], 0x80, 0x8a);
    if (S[0x43] !== 4) throw new Error('NP3 参数标志无效 (0x43)。');
    S[0x42] = clampNotFF(S[0x42], 0x6c, 0x94, [0]);
    if (S[0x3f] !== 1) throw new Error('NP3 参数标志无效 (0x3F)。');
    if (S[0x3e] !== 0xff) {
      if (S[0x3e] === 0) {
        S[0x22] = 0;
        S[0x24] = 0;
        S[0x42] = 0;
      } else {
        S[0x3e] = clampNotFF(S[0x3e], 0x7e, 0x82);
      }
    }

    if (ver === '0310') {
      if ((mask & 0x3fc00000) >>> 0 !== 0x3fc00000) {
        throw new Error('0310 Flexible Color NP3 缺少扩展色彩字段。');
      }
      const flexFlags = [
        [0x44, true],
        [0x46, true],
        [0x48, true],
        [0x4a, true],
        [0x4c, true],
        [0x4e, false],
      ];
      for (const [idx, allow1] of flexFlags) {
        if (S[idx + 1] !== 1) throw new Error('0310 明暗/效果启用标志无效。');
        S[idx] = clampNotFF(S[idx], 0x1c, 0xe4, allow1 ? [1] : null);
      }
      if (S[0x68] !== 1 || S[0x69] !== 1 || S[0x6a] !== 1) {
        throw new Error('0310 Color Blender 标志无效。');
      }
      for (let k = 0x50; k < 0x68; k++) S[k] = clampNotFF(S[k], 0x1c, 0xe4);
      if ((S[0x78] | (S[0x79] << 8)) !== 1 || S[0x7a] !== 1 || S[0x7b] !== 1 || S[0x7d] !== 1 || S[0x7f] !== 1) {
        throw new Error('0310 Color Grading 标志无效。');
      }
      for (let i = 0; i < 3; i++) {
        let hue = S[0x6c + i * 4] | (S[0x6d + i * 4] << 8);
        if (hue !== 0xffff) {
          if (hue < 0x8000) hue = 0x8000;
          else if (hue >= 0x8168) hue = 0x8167;
          S[0x6c + i * 4] = hue & 0xff;
          S[0x6d + i * 4] = (hue >>> 8) & 0xff;
        }
        if (S[0x6e + i * 4] !== 0xff) {
          S[0x6e + i * 4] = S[0x6e + i * 4] < 0x80 ? 0x80 : S[0x6e + i * 4] > 0xe4 ? 0xe4 : S[0x6e + i * 4];
        }
        S[0x6f + i * 4] = clampNotFF(S[0x6f + i * 4], 0x1c, 0xe4);
      }
      if (S[0x7c] !== 0xff) S[0x7c] = S[0x7c] < 0x80 ? 0x80 : S[0x7c] > 0xe4 ? 0xe4 : S[0x7c];
      S[0x7e] = clampNotFF(S[0x7e], 0x1c, 0xe4);
    }

    let modeType = 0;
    if (baseId >= 0x80d && baseId < 0x815) {
      modeType = 2;
    } else if (baseId >= 0x64d && baseId <= 0x655) {
      modeType = ((1 << (baseId - 0x64d)) & 0x181) !== 0 ? 1 : 0;
    }

    const words = new Uint32Array(20);
    words.fill(0xff);
    if (baseId === 0x2cf) {
      words[14] = S[0x3e];
      words[15] = S[0x34];
      words[16] = S[0x3c];
      words[17] = S[0x36];
      words[18] = S[0x38];
      words[19] = S[0x3a];
    } else {
      words[0] = S[0x3e];
      words[1] = S[0x22];
      words[2] = S[0x42];
      words[3] = S[0x24];
      words[4] = S[0x26];
      words[5] = S[0x28];
      words[8] = S[0x2a];
      words[9] = S[0x2c];
      words[10] = S[0x2e];
      words[11] = S[0x30];
      words[12] = S[0x32];
      words[13] = S[0x40];
    }

    const rec = new Uint8Array(SC_RECORD);
    const rdv = new DataView(rec.buffer);
    rdv.setUint32(0, 1, true); // valid = 1
    virtualKeys(slot, bank).forEach((k, i) => rdv.setUint32(4 + i * 4, k >>> 0, true));

    // main block (rec + 0x10, 0x114 B)
    for (let i = 0; i < 19; i++) {
      if (S[8 + i] === 0) break;
      rec[0x10 + i] = S[8 + i];
    }
    rec[0x10 + 0x14] = 1;
    rdv.setUint32(0x10 + 0x18, modeType, true);
    rdv.setUint32(0x10 + 0x1c, 0, true);
    for (const bankOff of [0x30, 0x80, 0xd0]) {
      for (let i = 0; i < 20; i++) rdv.setUint32(bankOff + i * 4, words[i], true);
    }
    rdv.setUint16(0x10 + 0x110, baseId, true);

    // auxiliary block (rec + 0x124, 0x242 B)
    rec.set(aux, 0x124);

    // Flexible Color 44-byte extra block (rec + 0x370, 0x2C B)
    if (baseId === 0x20) {
      rec[0x370] = S[0x44];
      rec[0x371] = S[0x46];
      rec[0x372] = S[0x48];
      rec[0x373] = S[0x4a];
      rec[0x374] = S[0x4c];
      rec[0x375] = S[0x4e];
      rec.set(S.subarray(0x50, 0x68), 0x376);
      rec.set(S.subarray(0x6c, 0x78), 0x38e);
      rec[0x39a] = S[0x7c];
      rec[0x39b] = S[0x7e];
    } else {
      rec.fill(0xff, 0x370, 0x39c);
    }
    return rec;
  }

  /**
   * Re-serialize a 1024-byte SC_RECORD back into a standard Nikon .NP3 file.
   */
  function slotRecordToNp3(recBytes) {
    const rec = recBytes instanceof Uint8Array ? recBytes : new Uint8Array(recBytes);
    if (rec.length !== SC_RECORD) throw new Error('SC_RECORD 长度不是 1024 B。');
    const rdv = new DataView(rec.buffer, rec.byteOffset, rec.byteLength);
    if (rdv.getUint32(0, true) !== 1) throw new Error('空槽位无有效滤镜数据。');

    const baseId = rdv.getUint16(0x120, true);
    const isFlex = baseId === 0x20;
    const is2cf = baseId === 0x2cf;
    const w = (i) => rdv.getUint32(0x30 + i * 4, true) & 0xff;

    const tlvs = [];
    const pushTlv = (tag, data) => tlvs.push([tag, data]);
    const verBytes = new Uint8Array(isFlex ? [0x30, 0x33, 0x31, 0x30] : [0x30, 0x33, 0x30, 0x30]);
    pushTlv(0x0100, verBytes);

    const name20 = new Uint8Array(20);
    for (let i = 0; i < 19; i++) {
      if (rec[0x10 + i] === 0) break;
      name20[i] = rec[0x10 + i];
    }
    pushTlv(0x0200, name20);
    pushTlv(0x0300, new Uint8Array([(baseId >>> 8) & 0xff, baseId & 0xff]));
    pushTlv(0x0400, new Uint8Array([0, 0]));

    const base2 = [
      [0x0500, 0xff, 1],
      [0x0600, is2cf ? 0xff : w(1), 4],
      [0x0700, is2cf ? 0xff : w(3), 4],
      [0x0800, is2cf ? 0xff : w(4), 4],
      [0x0900, is2cf ? 0xff : w(5), 4],
      [0x0a00, is2cf ? 0xff : w(8), 4],
      [0x0b00, is2cf ? 0xff : w(9), 4],
      [0x0c00, is2cf ? 0xff : w(10), 0],
      [0x0d00, is2cf ? 0xff : w(11), 0],
      [0x0e00, is2cf ? 0xff : w(12), 4],
      [0x0f00, is2cf ? w(15) : 0xff, 1],
      [0x1000, is2cf ? w(17) : 0xff, 1],
      [0x1100, is2cf ? w(18) : 0xff, 1],
      [0x1200, is2cf ? w(19) : 0xff, 1],
      [0x1300, is2cf ? w(16) : 0xff, 1],
      [0x1400, is2cf ? w(14) : w(0), 1],
      [0x1500, is2cf ? 0xff : w(13), 10],
      [0x1600, is2cf ? 0xff : w(2), 4],
    ];
    for (const [tag, v, mode] of base2) pushTlv(tag, new Uint8Array([v, mode]));

    if (isFlex) {
      for (let i = 0; i < 6; i++) {
        pushTlv(0x1900 + i * 0x100, new Uint8Array([rec[0x370 + i], 1]));
      }
      const b1f = new Uint8Array(28);
      b1f.set(rec.subarray(0x376, 0x38e), 0);
      b1f[24] = 1;
      b1f[25] = 1;
      b1f[26] = 1;
      pushTlv(0x1f00, b1f);

      const b20 = new Uint8Array(20);
      for (let i = 0; i < 3; i++) {
        const hue = rdv.getUint16(0x38e + i * 4, true);
        b20[i * 4] = (hue >>> 8) & 0xff;
        b20[i * 4 + 1] = hue & 0xff;
        b20[i * 4 + 2] = rec[0x390 + i * 4];
        b20[i * 4 + 3] = rec[0x391 + i * 4];
      }
      b20[12] = 1;
      b20[13] = 1;
      b20[14] = 1;
      b20[15] = 0;
      b20[16] = rec[0x39a];
      b20[17] = 1;
      b20[18] = rec[0x39b];
      b20[19] = 1;
      pushTlv(0x2000, b20);
    }

    const auxSlice = rec.subarray(0x124, 0x366);
    let hasAux = false;
    for (let i = 0; i < auxSlice.length; i++) {
      if (auxSlice[i] !== 0) {
        hasAux = true;
        break;
      }
    }
    if (hasAux) {
      const auxBE = new Uint8Array(0x242);
      auxBE.set(auxSlice);
      for (let k = 0x40; k < 0x242; k += 2) {
        const t = auxBE[k];
        auxBE[k] = auxBE[k + 1];
        auxBE[k + 1] = t;
      }
      pushTlv(2, auxBE);
    }

    let totalLen = 8; // 4B header + 4B zero end marker
    for (const [, d] of tlvs) totalLen += 8 + d.length;
    const out = new Uint8Array(totalLen);
    out[0] = 0x4e;
    out[1] = 0x43;
    out[2] = 0x50;
    out[3] = 0x00;
    const odv = new DataView(out.buffer);
    let p = 4;
    for (const [tag, d] of tlvs) {
      odv.setUint32(p, tag >>> 0, false);
      odv.setUint32(p + 4, d.length >>> 0, false);
      out.set(d, p + 8);
      p += 8 + d.length;
    }
    odv.setUint32(p, 0, false);
    return out;
  }

  function cloneRecordToSlot(srcRec, targetSlot, targetBank, overrideName = null) {
    slotToIndex(targetSlot, targetBank);
    const out = new Uint8Array(srcRec);
    const dv = new DataView(out.buffer);
    dv.setUint32(0, 1, true);
    virtualKeys(targetSlot, targetBank).forEach((k, i) => dv.setUint32(4 + i * 4, k >>> 0, true));
    if (overrideName !== null) {
      const clean = validateAsciiCameraName(overrideName);
      out.fill(0, 0x10, 0x24);
      for (let i = 0; i < clean.length; i++) out[0x10 + i] = clean.charCodeAt(i);
    }
    return out;
  }

  // -------------------------------------------------------------------------
  // Z8SCARD1 (.REC) Card Store Engine (matching slotcard.c)
  // -------------------------------------------------------------------------
  function headerOk(bytes, expectedGen) {
    if (!bytes || bytes.length < SC_HEADER) return false;
    for (let i = 0; i < 8; i++) if (bytes[i] !== SC_MAGIC.charCodeAt(i)) return false;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (dv.getUint32(8, true) !== 1) return false;
    if (dv.getUint32(12, true) !== SC_HEADER) return false;
    if (dv.getUint32(16, true) !== expectedGen >>> 0) return false;
    if (dv.getBigUint64(24, true) === 0n) return false;
    if (dv.getUint32(36, true) > SC_FILE_RECORDS) return false;
    return crc32(bytes.subarray(0, SC_HEADER - 4)) === dv.getUint32(SC_HEADER - 4, true);
  }

  function footerOk(bytes, expectedSize, expectedGen) {
    if (bytes.length !== expectedSize || expectedSize < SC_HEADER + SC_FOOTER) return false;
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const f = expectedSize - SC_FOOTER;
    return (
      dv.getUint32(f, true) === SC_FOOT_MAGIC &&
      dv.getUint32(f + 4, true) === expectedSize &&
      dv.getUint32(f + 8, true) === expectedGen >>> 0 &&
      dv.getBigUint64(f + 12, true) === dv.getBigUint64(24, true) &&
      dv.getUint32(f + 20, true) === crc32(bytes.subarray(0, expectedSize - 4))
    );
  }

  function randomStoreId() {
    if (typeof crypto !== 'undefined' && typeof crypto.getRandomValues === 'function') {
      const u = new Uint32Array(2);
      crypto.getRandomValues(u);
      const val = (BigInt(u[1]) << 32n) | BigInt(u[0]);
      return val === 0n ? 1n : val;
    }
    const lo = BigInt(Date.now() >>> 0);
    const hi = BigInt(((Math.random() * 0xffffffff) >>> 0) | 1);
    return (hi << 32n) | lo;
  }

  function createEmptyStore(limit = 64) {
    return {
      storeId: 0n,
      head: 0,
      nextGen: 1,
      table: new Uint32Array(SC_SLOTS),
      selection: [0, 0],
      proxy: [DEFAULT_PHOTO_SEL, 0],
      limit: limit === 32 ? 32 : 64,
      used: new Uint8Array(SC_SLOTS),
      bad: new Uint8Array(SC_SLOTS),
      records: new Array(SC_SLOTS).fill(null),
      dirty: new Uint8Array(SC_SLOTS),
      metaDirty: false,
      loadedFromCard: false,
      filesSkipped: 0,
      badSlots: 0,
    };
  }

  /**
   * Load the slot store from a Map<gen, Uint8Array> of FENESTRA/scXXXXXXXX.rec files,
   * using the exact gallop + bisect head probe and 64-gen walkback in slotcard.c.
   */
  function loadStoreFromFiles(filesMap) {
    const store = createEmptyStore(64);
    store.loadedFromCard = filesMap && filesMap.size > 0;
    if (!filesMap || filesMap.size === 0) return store;

    // Gallop + bisect starting from 1, identical to slotcard.c lines 129-146
    let a = 0;
    let b = 1;
    while (filesMap.has(b)) {
      a = b;
      if (b > 0x3fffffff) break;
      b *= 2;
    }
    while (b - a > 1) {
      const c = a + ((b - a) >>> 1);
      if (!filesMap.has(c)) b = c;
      else a = c;
    }

    // Fallback if the user dropped only isolated sc*.rec files without generation 1
    if (a === 0) {
      for (const k of filesMap.keys()) if (k > a) a = k;
    }
    store.nextGen = a + 1;
    if (a === 0) return store;

    let head = 0;
    let headFile = null;
    for (let cand = a, tries = 0; cand >= 1 && tries < SC_WALKBACK; cand--, tries++) {
      const bytes = filesMap.get(cand);
      if (headerOk(bytes, cand)) {
        const hdv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
        const total = SC_HEADER + hdv.getUint32(36, true) * SC_ENTRY + SC_FOOTER;
        if (bytes.length === total && footerOk(bytes, total, cand)) {
          head = cand;
          headFile = bytes;
          break;
        }
      }
      store.filesSkipped += 1;
    }
    if (!headFile) throw new Error('未在所选 FENESTRA 文件中校验到有效的 sc*.rec 记录（文件可能损坏或非 Z8 格式）。');

    const hdv = new DataView(headFile.buffer, headFile.byteOffset, headFile.byteLength);
    store.head = head;
    store.storeId = hdv.getBigUint64(24, true);
    store.selection = [hdv.getUint32(40, true), hdv.getUint32(44, true)];
    store.proxy = [hdv.getUint32(48, true) || DEFAULT_PHOTO_SEL, hdv.getUint32(52, true)];
    const lim = hdv.getUint32(56, true);
    store.limit = lim === 32 ? 32 : 64;

    for (let i = 0; i < SC_SLOTS; i++) {
      const g = hdv.getUint32(64 + i * 4, true);
      store.table[i] = g <= head ? g : 0;
    }

    // Resolve each referenced generation newest-first, matching slotcard.c lines 163-183
    while (true) {
      let targetGen = 0;
      for (let i = 0; i < SC_SLOTS; i++) {
        if (store.table[i] && !store.used[i] && !store.bad[i] && store.table[i] > targetGen) {
          targetGen = store.table[i];
        }
      }
      if (!targetGen) break;
      const df = filesMap.get(targetGen);
      if (headerOk(df, targetGen)) {
        const ddv = new DataView(df.buffer, df.byteOffset, df.byteLength);
        const entries = ddv.getUint32(36, true);
        for (let e = 0; e < entries; e++) {
          const at = SC_HEADER + e * SC_ENTRY;
          if (at + SC_ENTRY > df.length) break;
          const idx = df[at];
          if (idx >= SC_SLOTS || store.table[idx] !== targetGen) continue;
          const entryCrc = ddv.getUint32(at + 4, true);
          const rec = df.subarray(at + 8, at + 8 + SC_RECORD);
          if (crc32(rec) === entryCrc) {
            store.records[idx] = new Uint8Array(rec);
            store.used[idx] = 1;
          }
        }
      }
      for (let i = 0; i < SC_SLOTS; i++) {
        if (store.table[i] === targetGen && !store.used[i]) {
          store.bad[i] = 1;
          store.badSlots += 1;
        }
      }
    }

    return store;
  }

  function encodeGenerationFile(store, gen, dirtyIndices) {
    const batch = dirtyIndices.slice(0, SC_FILE_RECORDS);
    const total = SC_HEADER + batch.length * SC_ENTRY + SC_FOOTER;
    const out = new Uint8Array(total);
    const dv = new DataView(out.buffer);

    for (let i = 0; i < 8; i++) out[i] = SC_MAGIC.charCodeAt(i);
    dv.setUint32(8, 1, true);
    dv.setUint32(12, SC_HEADER, true);
    dv.setUint32(16, gen >>> 0, true);
    dv.setBigUint64(24, store.storeId, true);
    dv.setUint32(36, batch.length, true);
    dv.setUint32(40, store.selection[0] >>> 0, true);
    dv.setUint32(44, store.selection[1] >>> 0, true);
    dv.setUint32(48, store.proxy[0] >>> 0, true);
    dv.setUint32(52, store.proxy[1] >>> 0, true);
    dv.setUint32(56, store.limit === 32 ? 32 : 64, true);

    const batchSet = new Set(batch);
    for (let i = 0; i < SC_SLOTS; i++) {
      dv.setUint32(64 + i * 4, batchSet.has(i) ? gen >>> 0 : store.table[i] >>> 0, true);
    }

    let at = SC_HEADER;
    for (const idx of batch) {
      const rec = store.records[idx];
      out[at] = idx;
      dv.setUint32(at + 4, crc32(rec), true);
      out.set(rec, at + 8);
      at += SC_ENTRY;
    }

    dv.setUint32(SC_HEADER - 4, crc32(out.subarray(0, SC_HEADER - 4)), true);

    dv.setUint32(at, SC_FOOT_MAGIC, true);
    dv.setUint32(at + 4, total, true);
    dv.setUint32(at + 8, gen >>> 0, true);
    dv.setBigUint64(at + 12, store.storeId, true);
    dv.setUint32(at + 20, crc32(out.subarray(0, at + 20)), true);
    return out;
  }

  function hasPendingChanges(store) {
    if (store.metaDirty) return true;
    for (let i = 0; i < SC_SLOTS; i++) if (store.dirty[i]) return true;
    return false;
  }

  function countPendingChanges(store) {
    let n = 0;
    for (let i = 0; i < SC_SLOTS; i++) if (store.dirty[i]) n++;
    if (n === 0 && store.metaDirty) n = 1;
    return n;
  }

  /**
   * Commit pending dirty records & metadata into 1..K new contiguous scXXXXXXXX.rec files.
   */
  function commitStoreAppend(store, existingFilesMap = null) {
    if (!hasPendingChanges(store)) return [];
    if (store.storeId === 0n) store.storeId = randomStoreId();

    const emitted = [];
    const collectDirty = () => {
      const list = [];
      for (let i = 0; i < SC_SLOTS; i++) if (store.dirty[i] && store.records[i]) list.push(i);
      return list;
    };

    while (true) {
      const dirtyList = collectDirty();
      if (dirtyList.length === 0 && !store.metaDirty) break;

      while (existingFilesMap && existingFilesMap.has(store.nextGen)) store.nextGen += 1;
      const gen = store.nextGen;
      const batch = dirtyList.slice(0, SC_FILE_RECORDS);
      const bytes = encodeGenerationFile(store, gen, batch);

      for (const idx of batch) {
        store.table[idx] = gen;
        store.used[idx] = 1;
        store.bad[idx] = 0;
        store.dirty[idx] = 0;
      }
      store.head = gen;
      store.nextGen = gen + 1;
      store.metaDirty = false;
      if (existingFilesMap) existingFilesMap.set(gen, bytes);
      emitted.push({ name: formatScFilename(gen), gen, data: bytes });
    }
    return emitted;
  }

  /**
   * Non-destructive snapshot of the store compacted into clean sc00000001.rec.. files
   * (used when creating files for a brand-new / empty FENESTRA folder).
   */
  function buildCompactedFiles(store) {
    const storeId = store.storeId || randomStoreId();
    const liveIndices = [];
    for (let i = 0; i < SC_SLOTS; i++) {
      if (store.used[i] && store.records[i]) liveIndices.push(i);
    }
    const temp = {
      storeId,
      head: 0,
      nextGen: 1,
      table: new Uint32Array(SC_SLOTS),
      selection: [...store.selection],
      proxy: [...store.proxy],
      limit: store.limit,
      used: new Uint8Array(SC_SLOTS),
      bad: new Uint8Array(SC_SLOTS),
      records: store.records,
      dirty: new Uint8Array(SC_SLOTS),
      metaDirty: liveIndices.length === 0,
    };
    for (const idx of liveIndices) temp.dirty[idx] = 1;
    return commitStoreAppend(temp);
  }

  // -------------------------------------------------------------------------
  // Store Mutators
  // -------------------------------------------------------------------------
  function putSlotNp3(store, slot, banks, np3Bytes, overrideName = null) {
    const limit = store.limit === 32 ? 32 : 64;
    if (slot < 10 || slot > limit) throw new Error(`槽位 C-${slot} 超出当前上限 C-${limit}。`);
    for (const bank of banks) {
      const idx = slotToIndex(slot, bank);
      store.records[idx] = np3ToSlotRecord(np3Bytes, slot, bank, overrideName);
      store.used[idx] = 1;
      store.bad[idx] = 0;
      store.dirty[idx] = 1;
    }
  }

  function renameSlot(store, slot, banks, newName) {
    const clean = validateAsciiCameraName(newName);
    const limit = store.limit === 32 ? 32 : 64;
    if (slot < 10 || slot > limit) throw new Error(`槽位 C-${slot} 超出当前上限 C-${limit}。`);
    let count = 0;
    for (const bank of banks) {
      const idx = slotToIndex(slot, bank);
      const rec = store.records[idx];
      if (!store.used[idx] || !rec) continue;
      const copy = new Uint8Array(rec);
      copy.fill(0, 0x10, 0x24);
      for (let i = 0; i < clean.length; i++) copy[0x10 + i] = clean.charCodeAt(i);
      store.records[idx] = copy;
      store.dirty[idx] = 1;
      count++;
    }
    if (!count) throw new Error(`槽位 C-${slot} 为空，无法改名。`);
    return clean;
  }

  function transferSlot(store, fromSlot, toSlot, banks, mode = 'swap') {
    if (fromSlot === toSlot) return;
    const limit = store.limit === 32 ? 32 : 64;
    if (fromSlot < 10 || fromSlot > limit || toSlot < 10 || toSlot > limit) {
      throw new Error(`槽位操作仅限 C-10 ~ C-${limit}。`);
    }
    for (const bank of banks) {
      const fromIdx = slotToIndex(fromSlot, bank);
      const toIdx = slotToIndex(toSlot, bank);
      const fromRec = store.used[fromIdx] ? store.records[fromIdx] : null;
      const toRec = store.used[toIdx] ? store.records[toIdx] : null;
      if (!fromRec) continue;

      if (mode === 'swap' && toRec) {
        store.records[fromIdx] = cloneRecordToSlot(toRec, fromSlot, bank);
        store.records[toIdx] = cloneRecordToSlot(fromRec, toSlot, bank);
        store.dirty[fromIdx] = 1;
        store.dirty[toIdx] = 1;
      } else {
        store.records[toIdx] = cloneRecordToSlot(fromRec, toSlot, bank);
        store.used[toIdx] = 1;
        store.bad[toIdx] = 0;
        store.dirty[toIdx] = 1;
        if (mode === 'move' || (mode === 'swap' && !toRec)) {
          store.records[fromIdx] = null;
          store.used[fromIdx] = 0;
          store.dirty[fromIdx] = 0;
          store.table[fromIdx] = 0;
          store.metaDirty = true;
        }
      }
      const curDec = decodeSelector(store.selection[bank]);
      if (curDec && curDec.slot === fromSlot) {
        if (mode === 'move' || (mode === 'swap' && !toRec)) store.selection[bank] = selectorForSlot(toSlot, bank);
      }
    }
  }

  function deleteSlots(store, slots, banks) {
    const list = Array.from(new Set(slots)).filter((s) => s >= 10 && s <= 64);
    if (!list.length) return 0;
    let deleted = 0;
    for (const slot of list) {
      for (const bank of banks) {
        const idx = slotToIndex(slot, bank);
        if (store.used[idx] || store.table[idx]) deleted++;
        store.records[idx] = null;
        store.used[idx] = 0;
        store.bad[idx] = 0;
        store.dirty[idx] = 0;
        store.table[idx] = 0;
        store.metaDirty = true;

        const curDec = decodeSelector(store.selection[bank]);
        if (curDec && curDec.slot === slot) {
          store.selection[bank] = store.proxy[bank] || (bank === 0 ? DEFAULT_PHOTO_SEL : 0);
        }
      }
    }
    return deleted;
  }

  function setActiveSelection(store, slot, bank) {
    if (slot === null) {
      store.selection[bank] = store.proxy[bank] || (bank === 0 ? DEFAULT_PHOTO_SEL : 0);
      store.metaDirty = true;
      return store.selection[bank];
    }
    const idx = slotToIndex(slot, bank);
    if (!store.used[idx] || !store.records[idx]) {
      throw new Error(`槽位 C-${slot} 为空，不能设为默认启用。`);
    }
    const nextSel = selectorForSlot(slot, bank);
    store.selection[bank] = store.selection[bank] === nextSel
      ? (store.proxy[bank] || (bank === 0 ? DEFAULT_PHOTO_SEL : 0))
      : nextSel;
    store.metaDirty = true;
    return store.selection[bank];
  }

  function setSlotLimit(store, limit) {
    const v = limit === 32 ? 32 : 64;
    if (store.limit !== v) {
      store.limit = v;
      store.metaDirty = true;
    }
  }

  return {
    SC_SLOTS,
    SC_RECORD,
    SC_HEADER,
    SC_ENTRY,
    SC_FOOTER,
    SC_FILE_RECORDS,
    SC_MAGIC,
    SC_FOOT_MAGIC,
    crc32,
    slotToIndex,
    indexToSlotBank,
    virtualKeys,
    selectorForSlot,
    decodeSelector,
    formatScFilename,
    parseScFilename,
    validateAsciiCameraName,
    readRecordInfo,
    extractNp3Name,
    np3ToSlotRecord,
    slotRecordToNp3,
    cloneRecordToSlot,
    createEmptyStore,
    loadStoreFromFiles,
    hasPendingChanges,
    countPendingChanges,
    commitStoreAppend,
    buildCompactedFiles,
    putSlotNp3,
    renameSlot,
    transferSlot,
    deleteSlots,
    setActiveSelection,
    setSlotLimit,
  };
});
</script>
