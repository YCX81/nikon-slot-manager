    importFolderInput: $('importFolderInput'),
    singleSlotFileInput: $('singleSlotFileInput'),
    transferModal: $('transferModal'),
    modalTitle: $('modalTitle'),
    modalDesc: $('modalDesc'),
    modalTargetSlot: $('modalTargetSlot'),
    modalMode: $('modalMode'),
    btnModalCancel: $('btnModalCancel'),
    btnModalConfirm: $('btnModalConfirm'),
    replaceModal: $('replaceModal'),
    repModalTitle: $('repModalTitle'),
    repModalDesc: $('repModalDesc'),
    repPresetSelect: $('repPresetSelect'),
    repNameInput: $('repNameInput'),
    btnRepLocalFile: $('btnRepLocalFile'),
    btnRepCancel: $('btnRepCancel'),
    btnRepConfirm: $('btnRepConfirm'),
  };

  function t(key) {
    return (I18N[state.lang] && I18N[state.lang][key]) || I18N.zh[key] || key;
  }

  function getActiveLimit() {
    return state.store.limit === 32 ? 32 : 64;
  }

  function getTargetBanks() {
    return els.syncBothBanks.checked ? [0, 1] : [state.currentBank];
  }

  function getSlotRecordInfo(slot, bank = state.currentBank) {
    const idx = bank * 64 + (slot - 1);
    if (!state.store.used[idx] || !state.store.records[idx]) {
      return { valid: false, name: '', idx };
    }
    const info = SC.readRecordInfo(state.store.records[idx]);
    return { valid: info.valid, name: info.name, idx };
  }

  function getActiveBootSlot(bank = state.currentBank) {
    const dec = SC.decodeSelector(state.store.selection[bank]);
    return dec && dec.bank === bank && dec.extended ? dec.slot : null;
  }

  function countOccupiedInBank(bank = state.currentBank) {
    const limit = getActiveLimit();
    let n = 0;
    for (let s = 10; s <= limit; s++) {
      if (getSlotRecordInfo(s, bank).valid) n++;
    }
    return n;
  }

  function findNextEmptySlot(bank = state.currentBank, fromSlot = 10) {
    const limit = getActiveLimit();
    for (let s = Math.max(10, fromSlot); s <= limit; s++) {
      if (!getSlotRecordInfo(s, bank).valid) return s;
    }
    for (let s = 10; s < Math.max(10, fromSlot) && s <= limit; s++) {
      if (!getSlotRecordInfo(s, bank).valid) return s;
    }
    return null;
  }

  function nextFrame() {
    if (typeof window.requestAnimationFrame === 'function') {
      return new Promise((resolve) => window.requestAnimationFrame(() => resolve()));
    }
    return new Promise((resolve) => setTimeout(resolve, 0));
  }

  function setStatus(msg, kind = '') {
    els.statusMsg.textContent = msg;
    els.statusMsg.title = msg;
    els.statusMsg.classList.remove('ok', 'error', 'busy');
    if (kind === 'ok' || kind === 'error' || kind === 'busy') els.statusMsg.classList.add(kind);
  }

  function setProgress(pct) {
    clearTimeout(state.progressHideTimer);
    const clamped = Math.max(2, Math.min(100, Math.round(pct)));
    els.progressTrack.classList.remove('done', 'err');
    els.progressTrack.classList.add('active');
    els.progressFill.style.width = clamped + '%';
  }

  function finishProgress(ok = true) {
    clearTimeout(state.progressHideTimer);
    els.progressTrack.classList.add('active');
    els.progressTrack.classList.toggle('done', ok);
    els.progressTrack.classList.toggle('err', !ok);
    els.progressFill.style.width = '100%';
    state.progressHideTimer = setTimeout(() => {
      els.progressTrack.classList.remove('active', 'done', 'err');
      els.progressFill.style.width = '0%';
    }, ok ? 650 : 1200);
  }

  function setBusy(flag, triggerBtn = null, label = '') {
    state.busy = Boolean(flag);
    const lockControls = [
      els.btnOpenCard,
      els.btnSaveCard,
      els.btnQuickFill50,
      els.btnImportFolder,
      els.btnClearAllExt,
      els.btnFillFilteredEmpty,
      els.slotLimitSelect,
    ];
    for (const el of lockControls) {
      if (el) el.disabled = state.busy;
    }
    if (state.busy && triggerBtn) {
      state.busyBtn = triggerBtn;
      triggerBtn.classList.add('is-busy');
      if (label) triggerBtn.textContent = label;
    } else if (!state.busy && state.busyBtn) {
      state.busyBtn.classList.remove('is-busy');
      if (state.busyBtn === els.btnQuickFill50) els.btnQuickFill50.textContent = t('quick50Btn');
      else if (state.busyBtn === els.btnFillFilteredEmpty) els.btnFillFilteredEmpty.textContent = t('fillFilteredBtn');
      state.busyBtn = null;
    }
  }

  function updateBusyButtonLabel(label) {
    if (state.busy && state.busyBtn && label) state.busyBtn.textContent = label;
  }

  // -------------------------------------------------------------------------
  // Card Directory I/O (Direct File System Access API R/W + Cross-Platform Fallback)
  // -------------------------------------------------------------------------
  async function resolveFenestraDir(rootHandle) {
    if (rootHandle.name.toUpperCase() === 'FENESTRA') return rootHandle;
    for await (const entry of rootHandle.values()) {
      if (entry.kind === 'directory' && entry.name.toUpperCase() === 'FENESTRA') {
        return entry;
      }
    }
    for await (const entry of rootHandle.values()) {
      if (entry.kind === 'file' && (SC.parseScFilename(entry.name) || entry.name.toLowerCase() === 'slotcard.wlm')) {
        return rootHandle;
      }
    }
    return rootHandle.getDirectoryHandle('FENESTRA', { create: true });
  }

  async function readFromDirHandle(dirHandle) {
    const fenestraDir = await resolveFenestraDir(dirHandle);
    let mode = 'rw';
    if (typeof fenestraDir.queryPermission === 'function') {
      let perm = await fenestraDir.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted' && typeof fenestraDir.requestPermission === 'function') {
        perm = await fenestraDir.requestPermission({ mode: 'readwrite' });
      }
      if (perm !== 'granted') mode = 'ro';
    }

    const filesMap = new Map();
    for await (const entry of fenestraDir.values()) {
      if (entry.kind !== 'file') continue;
      const gen = SC.parseScFilename(entry.name);
      if (gen !== null) {
        const file = await entry.getFile();
        filesMap.set(gen, new Uint8Array(await file.arrayBuffer()));
      }
    }

    state.store = SC.loadStoreFromFiles(filesMap);
    state.cardFilesMap = filesMap;
    state.fenestraDirHandle = mode === 'rw' ? fenestraDir : null;
    state.cardMode = mode;
    state.focusedSlot = null;
    state.renamingSlot = null;

    const occ0 = countOccupiedInBank(0);
    const occ1 = countOccupiedInBank(1);
    setStatus(
      state.lang === 'zh'
        ? mode === 'rw'
          ? `已直连存储卡 FENESTRA（head #${state.store.head}）：照片 ${occ0} / 视频 ${occ1} 槽，所有修改实时写卡`
          : `已以只读方式读取 FENESTRA（head #${state.store.head}）：修改后请点右上角导出 ZIP`
        : mode === 'rw'
          ? `Connected FENESTRA R/W (head #${state.store.head}): Photo ${occ0}, Video ${occ1}`
          : `Loaded FENESTRA read-only (head #${state.store.head}): Export ZIP to save`,
      'ok'
    );
    renderAll();
  }

  async function handleOpenCardClick() {
    if (state.busy) return;
    const canPickNativeDir =
      typeof window.showDirectoryPicker === 'function' && window.isSecureContext;

    if (!canPickNativeDir) {
      els.cardDirInput.value = '';
      els.cardDirInput.click();
      return;
    }

    try {
      const rootHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await readFromDirHandle(rootHandle);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'SecurityError') {
        els.cardDirInput.value = '';
        els.cardDirInput.click();
        return;
      }
      const msg = err && err.message ? err.message : String(err);
      if (/system files|restricted|not allowed/i.test(msg)) {
        setStatus(
          state.lang === 'zh'
            ? '浏览器限制直接打开磁盘根目录：请点进存储卡里的 FENESTRA 文件夹后再点确定。'
            : 'Browser blocks drive roots: open the FENESTRA subfolder inside your card instead.',
          'error'
        );
      } else {
        setStatus(msg, 'error');
      }
    }
  }

  async function loadRecFilesList(fileList) {
    const all = Array.from(fileList || []);
    const fenestraMatches = [];
    const anyRecMatches = [];
    let sawKnownCardFolder = all.length === 0;

    for (const f of all) {
      const rel = f.webkitRelativePath || f.name;
      if (/(^|\/)(FENESTRA|DCIM|NIKON)(\/|$)/i.test(rel)) sawKnownCardFolder = true;
      const gen = SC.parseScFilename(f.name);
      if (gen !== null) {
        if (/(^|\/)FENESTRA\/[^/]+$/i.test(rel)) fenestraMatches.push({ gen, file: f });
        else anyRecMatches.push({ gen, file: f });
      }
    }

    const picked = fenestraMatches.length ? fenestraMatches : anyRecMatches;
    const filesMap = new Map();
    for (const item of picked) {
      filesMap.set(item.gen, new Uint8Array(await item.file.arrayBuffer()));
    }

    if (filesMap.size === 0 && !sawKnownCardFolder) {
      throw new Error(
        state.lang === 'zh'
          ? '所选目录中未找到 FENESTRA 或 sc*.rec 文件（请选择存储卡内的 FENESTRA 文件夹）。'
          : 'No FENESTRA folder or sc*.rec files found in selected directory.'
      );
    }

    state.store = SC.loadStoreFromFiles(filesMap);
    state.cardFilesMap = filesMap;
    state.fenestraDirHandle = null;
    state.cardMode = 'ro';
    state.focusedSlot = null;
    state.renamingSlot = null;

    const occ0 = countOccupiedInBank(0);
    const occ1 = countOccupiedInBank(1);
    setStatus(
      state.lang === 'zh'
        ? `已读取存储卡（head #${state.store.head}）：照片 ${occ0} / 视频 ${occ1} 槽。编辑完成后点「保存到存储卡 (.zip)」`
        : `Loaded card (head #${state.store.head}): Photo ${occ0}, Video ${occ1}. Click Save to export .rec`,
      'ok'
    );
    renderAll();
  }

  async function persistAfterMutation(actionSummary, progStart = null) {
    if (state.cardMode === 'rw' && state.fenestraDirHandle) {
      const ownsProgress = progStart === null;
      const basePct = ownsProgress ? 20 : progStart;
      const spanPct = 100 - basePct;
      try {
        const emitted = SC.commitStoreAppend(state.store, state.cardFilesMap);
        const total = Math.max(1, emitted.length);
        for (let i = 0; i < emitted.length; i++) {
          const item = emitted[i];
          const stepStart = basePct + ((i + 0.15) / total) * spanPct;
          setProgress(stepStart);
          setStatus(
            state.lang === 'zh'
              ? `正在写入存储卡 (${i + 1}/${total}) · ${item.name}…`
              : `Writing to card (${i + 1}/${total}) · ${item.name}…`,
            'busy'
          );
          updateBusyButtonLabel(
            state.lang === 'zh' ? `写卡中 ${i + 1}/${total}` : `Writing ${i + 1}/${total}`
          );
          await nextFrame();

          const fh = await state.fenestraDirHandle.getFileHandle(item.name, { create: true });
          const writable = await fh.createWritable();
          await writable.write(item.data);
          await writable.close();
          const checkFile = await fh.getFile();
          if (checkFile.size !== item.data.length) {
            throw new Error(`写入 ${item.name} 后校验长度不符。`);
          }
          setProgress(basePct + ((i + 1) / total) * spanPct);
        }
        finishProgress(true);
        setStatus(
          state.lang === 'zh'
            ? `${actionSummary} · 已写入卡 (${emitted.map((x) => x.name).join(', ')}) ✓`
            : `${actionSummary} · Saved to card (${emitted.length} file) ✓`,
          'ok'
        );
      } catch (err) {
        finishProgress(false);
        // Keep edits safely in memory so user can fall back to ZIP export
        state.cardMode = 'ro';
        state.fenestraDirHandle = null;
        setStatus(
          (state.lang === 'zh' ? '直连写卡失败（已保留本地改动，可点右上角导出 ZIP）：' : 'Direct write failed (kept in memory): ') +
            (err.message || err),
          'error'
        );
      }
    } else {
      if (progStart !== null) finishProgress(true);
      const pending = SC.countPendingChanges(state.store);
      setStatus(
        state.lang === 'zh'
          ? `${actionSummary}${pending > 0 ? ' · 点右上角「保存到存储卡」写回卡' : ''}`
          : `${actionSummary}${pending > 0 ? ' · Click Save to export .rec' : ''}`,
        'ok'
      );
    }
    renderAll();
  }

  async function handleSaveOrReloadCard() {
    if (state.busy) return;
    if (state.cardMode === 'rw' && state.fenestraDirHandle) {
      try {
        await readFromDirHandle(state.fenestraDirHandle);
      } catch (err) {
        setStatus(err.message || String(err), 'error');
      }
      return;
    }

    let files = [];
    if (state.cardMode === 'ro' && state.store.head > 0) {
      if (!SC.hasPendingChanges(state.store)) {
        setStatus(
          state.lang === 'zh'
            ? `当前卡数据（head #${state.store.head}）暂无新改动。`
            : `No unsaved changes (card head #${state.store.head}).`
        );
        return;
      }
      files = SC.commitStoreAppend(state.store, state.cardFilesMap);
    } else {
      if (countOccupiedInBank(0) === 0 && countOccupiedInBank(1) === 0 && !SC.hasPendingChanges(state.store)) {
        setStatus(state.lang === 'zh' ? '请先在左侧槽位中添加至少一个滤镜再保存。' : 'Add at least one filter first.', 'error');
        return;
      }
      files = SC.buildCompactedFiles(state.store);
      state.cardFilesMap.clear();
      for (const f of files) state.cardFilesMap.set(f.gen, f.data);
      state.store.head = files[files.length - 1].gen;
      state.store.nextGen = state.store.head + 1;
      state.store.dirty.fill(0);
      state.store.metaDirty = false;
      for (const f of files) {
        const dv = new DataView(f.data.buffer);
        const n = dv.getUint32(36, true);
        for (let e = 0; e < n; e++) state.store.table[f.data[SC.SC_HEADER + e * SC.SC_ENTRY]] = f.gen;
      }
    }

    const zipBytes = Z8Zip.createZip(files.map((f) => ({ name: f.name, data: f.data })));
    downloadBlob(zipBytes, 'Nikon-FENESTRA-Slots.zip', 'application/zip');
    setStatus(
      state.lang === 'zh'
        ? `已导出 ${files.map((f) => f.name).join(', ')} → 解压放入存储卡 FENESTRA 文件夹即可`
        : `Exported ${files.map((f) => f.name).join(', ')} — copy into card FENESTRA/`,
      'ok'
    );
    renderAll();
  }

  // -------------------------------------------------------------------------
  // Local .NP3 / .cube / .zip / Folder Batch Parsing
  // -------------------------------------------------------------------------
  function isIgnoredMetaFile(name) {
    const base = String(name || '').split(/[\\/]/).pop();
    return !base || base.startsWith('._') || base === '.DS_Store' || base.toLowerCase() === 'thumbs.db';
  }

  async function readEntryFiles(entry, out, depth = 0) {
    if (!entry || depth > 5) return;
    if (entry.isFile) {
      await new Promise((resolve) => {
        entry.file(
          (f) => {
            if (f && !isIgnoredMetaFile(f.name)) out.push(f);
            resolve();
          },
          () => resolve()
        );
      });
    } else if (entry.isDirectory) {
      const reader = entry.createReader();
      await new Promise((resolve) => {
        const readNext = () => {
          reader.readEntries(
            async (entries) => {
              if (!entries || !entries.length) {
                resolve();
                return;
              }
              for (const child of entries) await readEntryFiles(child, out, depth + 1);
              readNext();
            },
            () => resolve()
          );
        };
        readNext();
      });
    }
  }

  async function collectFilesFromDataTransfer(dt) {
    const out = [];
    if (dt && dt.items && dt.items.length && typeof dt.items[0].webkitGetAsEntry === 'function') {
      const entries = [];
      for (const item of Array.from(dt.items)) {
        if (item.kind === 'file') {
          const entry = item.webkitGetAsEntry();
          if (entry) entries.push(entry);
        }
      }
      for (const entry of entries) await readEntryFiles(entry, out, 0);
      if (out.length) return out;
    }
    return Array.from((dt && dt.files) || []).filter((f) => f && !isIgnoredMetaFile(f.name));
  }

  async function collectFilesFromDirHandle(dirHandle, out = [], depth = 0) {
    if (!dirHandle || depth > 5) return out;
    for await (const entry of dirHandle.values()) {
      if (isIgnoredMetaFile(entry.name)) continue;
      if (entry.kind === 'file') {
        if (/\.(np3|cube|zip|rec)$/i.test(entry.name)) {
          out.push(await entry.getFile());
        }
      } else if (entry.kind === 'directory') {
        await collectFilesFromDirHandle(entry, out, depth + 1);
      }
    }
    return out;
  }

  async function parseLocalFilterFiles(fileList) {
    const rawInputs = Array.from(fileList || []).filter((f) => f && !isIgnoredMetaFile(f.name));
    const candidates = [];
    const skipped = [];

    for (const f of rawInputs) {
      const lower = f.name.toLowerCase();
      if (lower.endsWith('.zip')) {
        try {
          const zipBytes = new Uint8Array(await f.arrayBuffer());
          const entries = await Z8Zip.extractZip(zipBytes);
          for (const ent of entries) {
            const base = ent.name.split(/[\\/]/).pop();
            if (isIgnoredMetaFile(base) || !/\.(np3|cube)$/i.test(base)) continue;
            candidates.push({ name: base, bytes: ent.data });
          }
        } catch (err) {
          skipped.push(`${f.name} (${err.message || err})`);
        }
      } else if (/\.(np3|cube)$/i.test(lower)) {
        candidates.push({ name: f.name, file: f });
      }
    }

    candidates.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

    if (!candidates.length) {
      throw new Error(
        skipped.length
          ? skipped[0]
          : state.lang === 'zh'
            ? '未找到有效的 .NP3、.cube 或包含 .NP3 的 .zip 文件。'
            : 'No valid .NP3, .cube, or .zip filter files found.'
      );
    }

    const items = [];
    const total = candidates.length;
    for (let i = 0; i < total; i++) {
      const c = candidates[i];
      const ext = c.name.split('.').pop().toLowerCase();
      try {
        if (ext === 'np3') {
          if (total > 3 && (i === 0 || (i + 1) % 5 === 0 || i === total - 1)) {
            setProgress(Math.round(((i + 1) / total) * 45));
            setStatus(
              state.lang === 'zh'
                ? `正在解析 .NP3 (${i + 1}/${total}) · ${c.name}…`
                : `Parsing .NP3 (${i + 1}/${total}) · ${c.name}…`,
              'busy'
            );
            await nextFrame();
          }
          const raw = c.bytes ? c.bytes : new Uint8Array(await c.file.arrayBuffer());
          const camName = sanitizeAsciiName(SC.extractNp3Name(raw) || c.name);
          // Dry-run compile to fail fast if corrupt
          SC.np3ToSlotRecord(raw, 10, 0, camName);
          items.push({
            id: 'local-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 6),
            name: c.name.replace(/\.np3$/i, ''),
            nameEn: c.name.replace(/\.np3$/i, ''),
            cameraName: camName,
            group: '__local__',
            np3: raw,
            isLocal: true,
          });
        } else {
          setProgress(Math.round(((i + 0.2) / total) * 90));
          setStatus(
            state.lang === 'zh'
              ? `正在转换 ${c.name} (${i + 1}/${total})…`
              : `Converting ${c.name} (${i + 1}/${total})…`,
            'busy'
          );
          await nextFrame();
          const text = c.bytes ? new TextDecoder('utf-8').decode(c.bytes) : await c.file.text();
          const cube = C.parseCube(text);
          const fitRes = await C.fit(cube, { input: 'srgb', output: 'srgb', strength: 1 });
          const camName = sanitizeAsciiName(cube.title || c.name);
          const np3 = C.encodeNP3(fitRes.params, camName);
          items.push({
            id: 'local-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 6),
            name: c.name.replace(/\.cube$/i, ''),
            nameEn: c.name.replace(/\.cube$/i, ''),
            cameraName: camName,
            group: '__local__',
            np3,
            isLocal: true,
          });
          setProgress(Math.round(((i + 1) / total) * 95));
        }
      } catch (err) {
        skipped.push(`${c.name} (${err.message || err})`);
      }
    }

    if (!items.length) {
      throw new Error(skipped[0] || (state.lang === 'zh' ? '所有文件均无法解析。' : 'Failed to parse selected files.'));
    }
    return { items, skipped };
  }

  async function importBatchFilesIntoSlots(rawFiles, startSlot = null) {
    const files = Array.from(rawFiles || []).filter((f) => f && !isIgnoredMetaFile(f.name));
    if (!files.length) return;
    const recFiles = files.filter((f) => /\.rec$/i.test(f.name));
    if (recFiles.length && !files.some((f) => /\.(np3|cube|zip)$/i.test(f.name))) {
      try {
        await loadRecFilesList(recFiles);
      } catch (err) {
        setStatus(err.message || String(err), 'error');
      }
      return;
    }

    setBusy(true);
    try {
      const { items: parsed, skipped } = await parseLocalFilterFiles(files);
      addItemsToLibrary(parsed);
      const limit = getActiveLimit();
      const batch = [];
      const explicitStart = startSlot !== null ? startSlot : state.focusedSlot;
      let cursor = explicitStart || 10;
      for (const item of parsed) {
        if (!explicitStart) {
          while (cursor <= limit && getSlotRecordInfo(cursor).valid) cursor++;
        }
        if (cursor > limit) break;
        batch.push({ slot: cursor, name: item.cameraName, np3: item.np3 });
        cursor++;
      }
      setBusy(false);

      const skipNote = skipped.length
        ? state.lang === 'zh'
          ? `（跳过 ${skipped.length} 个无效文件）`
          : ` (${skipped.length} skipped)`
        : '';
      const overflowCount = parsed.length - batch.length;
      const overflowNote = overflowCount > 0
        ? state.lang === 'zh'
          ? `，另有 ${overflowCount} 个已存入右侧素材库`
          : `, ${overflowCount} more added to library`
        : '';

      if (!batch.length) {
        finishProgress(true);
        state.libGroup = '__local__';
        setStatus(
          state.lang === 'zh'
            ? `已加入 ${parsed.length} 个到右侧「本地添加」，左侧已无空槽${skipNote}`
            : `Added ${parsed.length} to library (no empty slots left)${skipNote}`,
          'error'
        );
        renderAll();
        return;
      }

      const summary =
        batch.length === 1
          ? `C-${batch[0].slot} ← ${batch[0].name}${skipNote}`
          : state.lang === 'zh'
            ? `已批量导入 ${batch.length} 个滤镜到 C-${batch[0].slot}~C-${batch[batch.length - 1].slot}${overflowNote}${skipNote}`
            : `Imported ${batch.length} filters into C-${batch[0].slot}–C-${batch[batch.length - 1].slot}${overflowNote}${skipNote}`;
      await writeItemsToSlots(batch, summary);
    } catch (err) {
      setBusy(false);
      finishProgress(false);
      setStatus(err && err.message ? err.message : String(err), 'error');
    }
  }

  async function importBatchFilesIntoLibrary(rawFiles) {
    const files = Array.from(rawFiles || []).filter((f) => f && !isIgnoredMetaFile(f.name));
    if (!files.length) return;
    setBusy(true);
    try {
      const { items: parsed, skipped } = await parseLocalFilterFiles(files);
      addItemsToLibrary(parsed);
      state.libGroup = '__local__';
      setBusy(false);
      finishProgress(true);
      const skipNote = skipped.length
        ? state.lang === 'zh'
          ? `（跳过 ${skipped.length} 个无效文件）`
          : ` (${skipped.length} skipped)`
        : '';
      setStatus(
        state.lang === 'zh'
          ? `已批量添加 ${parsed.length} 个滤镜到「本地添加」${skipNote}，可点下方「填入当前列表到空槽」`
          : `Added ${parsed.length} filter(s) to Local Files${skipNote}`,
        'ok'
      );
      renderAll();
    } catch (err) {
      setBusy(false);
      finishProgress(false);
      setStatus(err && err.message ? err.message : String(err), 'error');
    }
  }

  async function handleImportFolderClick() {
    if (state.busy) return;
    const canPickNativeDir = typeof window.showDirectoryPicker === 'function' && window.isSecureContext;
    if (!canPickNativeDir) {
      els.importFolderInput.value = '';
      els.importFolderInput.click();
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: 'read' });
      const collected = await collectFilesFromDirHandle(dirHandle);
      if (!collected.length) {
        setStatus(
          state.lang === 'zh'
            ? '所选文件夹中未找到 .NP3 / .cube / .zip 文件。'
            : 'No .NP3, .cube, or .zip files found in folder.',
          'error'
        );
        return;
      }
      await importBatchFilesIntoSlots(collected, null);
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      if (err && err.name === 'SecurityError') {
        els.importFolderInput.value = '';
        els.importFolderInput.click();
        return;
      }
      setStatus(err && err.message ? err.message : String(err), 'error');
    }
  }

  function addItemsToLibrary(newItems) {
    state.library = [...newItems, ...state.library];
    if (newItems[0]) state.activeLibId = newItems[0].id;
  }

  // -------------------------------------------------------------------------
  // Slot Mutations (Instant in RAM, progressive animation + auto-write in R/W)
  // -------------------------------------------------------------------------
  async function writeItemsToSlots(entries, label, opts = {}) {
    const banks = getTargetBanks();
    const total = entries.length;
    const isBatch = total > 1;
    const triggerBtn = opts.triggerBtn || null;
    const summary = label || (state.lang === 'zh' ? `已写入 ${total} 个槽位` : `Wrote ${total} slot(s)`);

    if (!isBatch) {
      for (const it of entries) {
        SC.putSlotNp3(state.store, it.slot, banks, it.np3, it.name);
      }
      state.recentSlots = new Set(entries.map((it) => it.slot));
      await persistAfterMutation(summary);
      state.recentSlots.clear();
      return;
    }

    const isRw = state.cardMode === 'rw' && Boolean(state.fenestraDirHandle);
    const compileWeight = isRw ? 55 : 98;
    const chunkSize = total >= 25 ? 5 : Math.max(1, Math.ceil(total / 8));

    setBusy(
      true,
      triggerBtn,
      state.lang === 'zh' ? `灌入中 0/${total}` : `Filling 0/${total}`
    );
    setProgress(4);
    setStatus(
      state.lang === 'zh' ? `正在准备写入 ${total} 款滤镜…` : `Preparing ${total} filters…`,
      'busy'
    );
    await nextFrame();

    try {
      for (let i = 0; i < total; i += chunkSize) {
        const end = Math.min(total, i + chunkSize);
        const batchSlots = new Set();
        let lastItem = null;
        for (let j = i; j < end; j++) {
          const it = entries[j];
          SC.putSlotNp3(state.store, it.slot, banks, it.np3, it.name);
          batchSlots.add(it.slot);
          lastItem = it;
        }
        state.recentSlots = batchSlots;
        const pct = 4 + (end / total) * (compileWeight - 4);
        setProgress(pct);
        setStatus(
          state.lang === 'zh'
            ? `正在编排滤镜 ${end}/${total} · C-${lastItem.slot} ${lastItem.name}…`
            : `Staging ${end}/${total} · C-${lastItem.slot} ${lastItem.name}…`,
          'busy'
        );
        updateBusyButtonLabel(
          state.lang === 'zh' ? `灌入中 ${end}/${total}` : `Filling ${end}/${total}`
        );
        renderToolbarAndFooter();
        renderSlotGrid();
        await nextFrame();
      }
      state.recentSlots.clear();
      await persistAfterMutation(summary, compileWeight);
    } catch (err) {
      state.recentSlots.clear();
      finishProgress(false);
      setStatus(err && err.message ? err.message : String(err), 'error');
      renderAll();
    } finally {
      setBusy(false);
    }
  }

  async function handleQuickFill50() {
    if (state.busy) return;
    const builtins = state.library.filter((x) => !x.isLocal);
    const maxN = Math.min(builtins.length, getActiveLimit() - 9);
    const items = [];
    for (let i = 0; i < maxN; i++) {
      items.push({ slot: 10 + i, name: builtins[i].cameraName, np3: builtins[i].np3 });
    }
    await writeItemsToSlots(
      items,
      state.lang === 'zh' ? `已灌入 ${maxN} 款预设到 C-10~C-${9 + maxN}` : `Filled ${maxN} presets`,
      { triggerBtn: els.btnQuickFill50 }
    );
  }

  async function handleFillFilteredToEmpty() {
    if (state.busy) return;
    const items = getFilteredLibrary();
    if (!items.length) return;
    const limit = getActiveLimit();
    const batch = [];
    let cursor = 10;
    for (const item of items) {
      while (cursor <= limit && getSlotRecordInfo(cursor).valid) cursor++;
      if (cursor > limit) break;
      batch.push({ slot: cursor, name: item.cameraName, np3: item.np3 });
      cursor++;
    }
    if (!batch.length) {
      setStatus(state.lang === 'zh' ? '当前没有空闲槽位可填入。' : 'No empty slots left.', 'error');
      return;
    }
    await writeItemsToSlots(
      batch,
      state.lang === 'zh' ? `已填入 ${batch.length} 个空闲槽` : `Filled ${batch.length} empty slot(s)`,
      { triggerBtn: els.btnFillFilteredEmpty }
    );
  }

  async function handleRenameSlot(slot, rawName) {
    state.renamingSlot = null;
    try {
      const clean = SC.renameSlot(state.store, slot, getTargetBanks(), rawName);
      await persistAfterMutation(state.lang === 'zh' ? `C-${slot} 已改名为 "${clean}"` : `Renamed C-${slot} to "${clean}"`);
    } catch (err) {
      setStatus(err.message || String(err), 'error');
      renderAll();
    }
  }

  async function handleTransferSlot(fromSlot, toSlot, mode = 'swap') {
    if (fromSlot === toSlot) return;
    try {
      SC.transferSlot(state.store, fromSlot, toSlot, getTargetBanks(), mode);
      state.focusedSlot = toSlot;
      await persistAfterMutation(
        state.lang === 'zh' ? `已调整槽位 C-${fromSlot} ↔ C-${toSlot}` : `Updated C-${fromSlot} → C-${toSlot}`
      );
    } catch (err) {
      setStatus(err.message || String(err), 'error');
    }
  }

  async function handleDeleteSlots(slots) {
    try {
      const list = slots.filter((s) => s >= 10);
      SC.deleteSlots(state.store, list, getTargetBanks());
      if (list.includes(state.focusedSlot)) state.focusedSlot = null;
      await persistAfterMutation(
        list.length === 1
          ? state.lang === 'zh'
            ? `已删除 C-${list[0]}`
            : `Deleted C-${list[0]}`
          : state.lang === 'zh'
            ? `已清空 ${list.length} 个槽位`
            : `Cleared ${list.length} slots`
      );
    } catch (err) {
      setStatus(err.message || String(err), 'error');
    }
  }

  async function handleToggleDefault(slot) {
    try {
      const sel = SC.setActiveSelection(state.store, slot, state.currentBank);
      const isActive = Boolean(SC.decodeSelector(sel)?.extended);
      await persistAfterMutation(
        isActive
          ? state.lang === 'zh'
            ? `已设 C-${slot} 为开机默认`
            : `Set C-${slot} as default`
          : state.lang === 'zh'
            ? `已取消 C-${slot} 默认选中`
            : `Cleared default C-${slot}`
      );
    } catch (err) {
      setStatus(err.message || String(err), 'error');
    }
  }

  // Rendering
  // -------------------------------------------------------------------------
  function applyStaticI18n() {
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.getAttribute('data-i18n');
      if (key) el.textContent = t(key);
    });
    els.libSearch.placeholder = t('libSearchPh');
    els.langZh.classList.toggle('active', state.lang === 'zh');
    els.langEn.classList.toggle('active', state.lang === 'en');
  }

  function renderHeader() {
    els.cardStatePill.className = 'card-pill' + (state.cardMode === 'rw' ? ' rw' : state.cardMode === 'ro' ? ' ro' : '');
    const headSuffix = state.store.head > 0 ? ` (#${state.store.head})` : '';
    els.cardStateText.textContent =
      state.cardMode === 'rw'
        ? t('stateRw') + headSuffix
        : state.cardMode === 'ro'
          ? t('stateRo') + headSuffix
          : t('stateOffline');

    els.btnOpenCard.textContent = state.cardMode === 'offline' ? t('openCardBtn') : t('reopenCardBtn');

    if (state.cardMode === 'rw') {
      els.btnSaveCard.className = 'btn';
      els.btnSaveCard.textContent = t('refreshRwBtn');
    } else {
      const pending = SC.countPendingChanges(state.store);
      els.btnSaveCard.className = 'btn accent';
      els.btnSaveCard.textContent =
        pending > 0
          ? state.lang === 'zh'
            ? `💾 保存到存储卡 (${pending}) (.zip)`
            : `💾 Save Card (${pending}) (.zip)`
          : t('saveZipBtn');

  function renderToolbarAndFooter() {
    els.tabBank0.classList.toggle('active', state.currentBank === 0);
    els.tabBank1.classList.toggle('active', state.currentBank === 1);
    els.sfAll.classList.toggle('active', state.slotFilter === 'all');
    els.sfOcc.classList.toggle('active', state.slotFilter === 'occupied');
    els.sfEmp.classList.toggle('active', state.slotFilter === 'empty');
    els.slotLimitSelect.value = String(getActiveLimit());

    const limit = getActiveLimit();
    const totalExt = limit - 9;
    const occ = countOccupiedInBank(state.currentBank);
    els.slotUsageText.textContent = `${occ} / ${totalExt}`;

    els.btnClearAllExt.hidden = occ === 0;
    els.btnClearAllExt.textContent = state.clearAllArmed ? t('clearAllConfirm') : t('clearAllBtn');

    if (state.focusedSlot) {
      els.focusSlotHint.textContent =
        state.lang === 'zh' ? `目标: C-${state.focusedSlot}` : `Target: C-${state.focusedSlot}`;
    } else {
      const nextEmpty = findNextEmptySlot(state.currentBank, 10);
      els.focusSlotHint.textContent = nextEmpty
        ? state.lang === 'zh'
          ? `自动空槽 C-${nextEmpty}`
          : `Next Empty C-${nextEmpty}`
        : state.lang === 'zh'
          ? '槽位已满'
          : 'All Full';

  function makeIconBtn(label, extraClass, title, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'ic-btn' + (extraClass ? ' ' + extraClass : '');
    b.textContent = label;
    if (title) b.title = title;
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      onClick();
    });
    return b;
  }

  function renderSlotGrid() {
    const grid = els.extSlotGrid;
    grid.textContent = '';
    const limit = getActiveLimit();
    const activeSlot = getActiveBootSlot(state.currentBank);

    for (let slot = 10; slot <= 64; slot++) {
      const locked = slot > limit;
      const info = locked ? { valid: false, name: '' } : getSlotRecordInfo(slot, state.currentBank);
      const occ = !locked && info.valid;

      if (!locked) {
        if (state.slotFilter === 'occupied' && !occ) continue;
        if (state.slotFilter === 'empty' && occ) continue;
      }

      const isFocused = state.focusedSlot === slot;
      const isAct = occ && activeSlot === slot;
      const isRenaming = state.renamingSlot === slot;

      const card = document.createElement('div');
      card.className =
        'slot-card' +
        (locked ? ' locked' : occ ? ' occupied' : ' empty') +
        (occ && state.recentSlots.has(slot) ? ' just-filled' : '') +
        (isAct ? ' active-cam' : '') +
        (isFocused ? ' focused' : '');

      if (!locked && occ && !isRenaming) {
        card.draggable = true;
        card.addEventListener('dragstart', (e) => {
          e.dataTransfer.setData('text/x-z8-slot', String(slot));
          e.dataTransfer.effectAllowed = 'move';
        });
      }

      if (!locked) {
        card.addEventListener('dragover', (e) => {
          e.preventDefault();
          card.classList.add('drag-over');
        });
        card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
        card.addEventListener('drop', (e) => {
          e.preventDefault();
          e.stopPropagation();
          card.classList.remove('drag-over');
          els.slotsPanel.classList.remove('panel-drag');
          handleDropOnSlot(slot, e.dataTransfer);
        });
        card.addEventListener('click', (e) => {
          if (e.target.closest('button,input')) return;
          state.focusedSlot = state.focusedSlot === slot ? null : slot;
          renderToolbarAndFooter();
          renderSlotGrid();
          renderLibraryList();
        });
      }

      const num = document.createElement('span');
      num.className = 'sc-num';
      num.textContent = `C-${slot}`;
      card.appendChild(num);

      if (locked) {
        const d = document.createElement('span');
        d.className = 'sc-dash';
        d.textContent = 'C32';
        card.appendChild(d);
        grid.appendChild(card);
        continue;
      }

      if (isRenaming) {
        const row = document.createElement('div');
        row.className = 'rename-row';
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.className = 'rename-input';
        inp.maxLength = 19;
        inp.value = info.name || '';
        const okB = makeIconBtn('✓', 'fill', 'Confirm', () => handleRenameSlot(slot, inp.value));
        const noB = makeIconBtn('✕', '', 'Cancel', () => {
          state.renamingSlot = null;
          renderSlotGrid();
        });
        inp.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter') handleRenameSlot(slot, inp.value);
          else if (ev.key === 'Escape') {
            state.renamingSlot = null;
            renderSlotGrid();
          }
        });
        row.append(inp, okB, noB);
        card.appendChild(row);
        setTimeout(() => {
          inp.focus();
          inp.select();
        }, 0);
        grid.appendChild(card);
        continue;
      }

      if (occ) {
        if (isAct) {
          const dot = document.createElement('span');
          dot.className = 'active-dot';
          dot.title = state.lang === 'zh' ? '相机开机默认选中' : 'Camera Boot Default';
          card.appendChild(dot);
        }
        const nm = document.createElement('span');
        nm.className = 'sc-name';
        nm.textContent = info.name;
        nm.title = info.name;
        nm.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          state.renamingSlot = slot;
          renderSlotGrid();
        });
        card.appendChild(nm);

        const acts = document.createElement('div');
        acts.className = 'sc-actions';
        acts.appendChild(
          makeIconBtn(isAct ? '★' : '☆', isAct ? 'on' : '', state.lang === 'zh' ? '设为开机默认' : 'Set Default', () =>
            handleToggleDefault(slot)
          )
        );
        acts.appendChild(
          makeIconBtn('✎', '', state.lang === 'zh' ? '改名' : 'Rename', () => {
            state.renamingSlot = slot;
            renderSlotGrid();
          })
        );
        acts.appendChild(
          makeIconBtn('⇄', '', state.lang === 'zh' ? '移动 / 替换' : 'Move / Swap', () => openTransferModal(slot))
        );
        acts.appendChild(
          makeIconBtn('×', 'del', state.lang === 'zh' ? '删除' : 'Delete', () => handleDeleteSlots([slot]))
        );
        card.appendChild(acts);
      } else {
        const dash = document.createElement('span');
        dash.className = 'sc-dash';
        dash.textContent = '—';
        card.appendChild(dash);

        const acts = document.createElement('div');
        acts.className = 'sc-actions';
        acts.appendChild(
          makeIconBtn(state.lang === 'zh' ? '+ 填入' : '+ Fill', 'fill', '', () => {
            openReplaceModal(slot, false);
          })
        );
        acts.appendChild(
          makeIconBtn('📁', '', state.lang === 'zh' ? '选择本地文件' : 'Pick File', () => {
            state.singleFileTargetSlot = slot;
            els.singleSlotFileInput.value = '';
            els.singleSlotFileInput.click();
          })
        );
        card.appendChild(acts);
      }

      grid.appendChild(card);
    }
  }

  function getFilteredLibrary() {
    const q = state.libQuery.trim().toLowerCase();
    return state.library.filter((it) => {
      if (state.libGroup !== 'all' && it.group !== state.libGroup) return false;
      if (!q) return true;
      return (
        it.name.toLowerCase().includes(q) ||
        it.nameEn.toLowerCase().includes(q) ||
        it.cameraName.toLowerCase().includes(q)
      );
    });
  }

  function renderLibraryGroupSelect() {
    const sel = els.libGroupSelect;
    const prev = state.libGroup;
    const counts = new Map();
    counts.set('all', state.library.length);
    for (const it of state.library) counts.set(it.group, (counts.get(it.group) || 0) + 1);

    sel.textContent = '';
    for (const [grp, cnt] of counts.entries()) {
      const opt = document.createElement('option');
      opt.value = grp;
      const key = grp === 'all' ? 'grpAll' : GROUP_KEY_MAP[grp];
      opt.textContent = `${key ? t(key) : grp} (${cnt})`;
      sel.appendChild(opt);
    }
    if (counts.has(prev)) sel.value = prev;
    else {
      state.libGroup = 'all';
      sel.value = 'all';
    }
  }

  function renderLibraryList() {
    const list = els.libList;
    list.textContent = '';
    const visible = getFilteredLibrary();
    const limit = getActiveLimit();

    const nameToSlot = new Map();
    for (let s = 10; s <= limit; s++) {
      const r = getSlotRecordInfo(s, state.currentBank);
      if (r.valid && r.name) {
        const k = r.name.toLowerCase();
        if (!nameToSlot.has(k)) nameToSlot.set(k, s);
      }
    }

    const nextEmpty = findNextEmptySlot(state.currentBank, 10);
    const putTarget = state.focusedSlot || nextEmpty;

    for (const item of visible) {
      const row = document.createElement('div');
      row.className = 'lib-item' + (state.activeLibId === item.id ? ' active' : '');
      row.draggable = true;
      row.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/x-z8-preset', item.id);
        e.dataTransfer.effectAllowed = 'copy';
      });

      const left = document.createElement('div');
      left.className = 'lib-main';
      const title = document.createElement('span');
      title.className = 'lib-title';
      title.textContent = state.lang === 'zh' ? item.name : item.nameEn;
      title.title = title.textContent;
      left.appendChild(title);

      const inSlot = nameToSlot.get(item.cameraName.trim().toLowerCase());
      if (inSlot) {
        const pill = document.createElement('span');
        pill.className = 'in-cam-pill';
        pill.textContent = `C-${inSlot}`;
        left.appendChild(pill);
      }

      const right = document.createElement('div');
      right.className = 'lib-right';
      const camSpan = document.createElement('span');
      camSpan.className = 'lib-camname';
      camSpan.textContent = item.cameraName;

      const putBtn = document.createElement('button');
      putBtn.type = 'button';
      putBtn.className = 'lib-put';
      putBtn.disabled = !putTarget;
      putBtn.textContent = putTarget
        ? state.lang === 'zh'
          ? `${state.focusedSlot && getSlotRecordInfo(putTarget).valid ? '替换' : '填入'} C-${putTarget}`
          : `${state.focusedSlot && getSlotRecordInfo(putTarget).valid ? 'Replace' : 'Put'} C-${putTarget}`
        : state.lang === 'zh'
          ? '已满'
          : 'Full';

      putBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!putTarget) return;
        writeItemsToSlots(
          [{ slot: putTarget, name: item.cameraName, np3: item.np3 }],
          `C-${putTarget} ← ${item.cameraName}`
        );
      });

      row.addEventListener('click', () => {
        state.activeLibId = item.id;
        renderLibraryList();
      });
      row.addEventListener('dblclick', () => {
        if (!putTarget) return;
        writeItemsToSlots(
          [{ slot: putTarget, name: item.cameraName, np3: item.np3 }],
          `C-${putTarget} ← ${item.cameraName}`
        );
      });

      right.append(camSpan, putBtn);
      row.append(left, right);
      list.appendChild(row);
    }
  }

  function renderAll() {
    applyStaticI18n();
    renderHeader();
    renderToolbarAndFooter();
    renderSlotGrid();
    renderLibraryGroupSelect();
    renderLibraryList();
  }

  // -------------------------------------------------------------------------
  // Drag & Drop, Modals, and .NP3 ZIP Export
  // -------------------------------------------------------------------------
  async function handleDropOnSlot(targetSlot, dt) {
    if (!dt || state.busy) return;
    const fromSlotStr = dt.getData('text/x-z8-slot');
    if (fromSlotStr) {
      const fromSlot = parseInt(fromSlotStr, 10);
      if (Number.isInteger(fromSlot) && fromSlot >= 10 && fromSlot !== targetSlot) {
        await handleTransferSlot(fromSlot, targetSlot, 'swap');
      }
      return;
    }

    const presetId = dt.getData('text/x-z8-preset');
    if (presetId) {
      const item = state.library.find((x) => x.id === presetId);
      if (item) await writeItemsToSlots([{ slot: targetSlot, name: item.cameraName, np3: item.np3 }], `C-${targetSlot} ← ${item.cameraName}`);
      return;
    }

    const dropped = await collectFilesFromDataTransfer(dt);
    if (dropped.length > 0) {
      await importBatchFilesIntoSlots(dropped, targetSlot);
    }
  }

  function openTransferModal(fromSlot) {
    state.transferFromSlot = fromSlot;
    const info = getSlotRecordInfo(fromSlot);
    const limit = getActiveLimit();
    els.modalTitle.textContent = t('modalTitle');
    els.modalDesc.textContent =
      state.lang === 'zh'
        ? `当前源槽：C-${fromSlot} (${info.name})`
        : `Source slot: C-${fromSlot} (${info.name})`;
    els.modalTargetSlot.textContent = '';
    for (let s = 10; s <= limit; s++) {
      if (s === fromSlot) continue;
      const opt = document.createElement('option');
      opt.value = String(s);
      const r = getSlotRecordInfo(s);
      opt.textContent = r.valid ? `C-${s} · ${r.name}` : `C-${s} (${state.lang === 'zh' ? '空闲' : 'Empty'})`;
      els.modalTargetSlot.appendChild(opt);
    }
    const nextEmp = findNextEmptySlot(state.currentBank, 10);
    if (nextEmp && nextEmp !== fromSlot) els.modalTargetSlot.value = String(nextEmp);
    els.transferModal.hidden = false;
  }

  function openReplaceModal(slot, isReplacing) {
    state.replaceTargetSlot = slot;
    const cur = getSlotRecordInfo(slot);
    els.repModalTitle.textContent = t('repTitleAdd');
    els.repModalDesc.textContent =
      isReplacing && cur.valid
        ? state.lang === 'zh'
          ? `替换 C-${slot}（当前：${cur.name}）：`
          : `Replace C-${slot} (current: ${cur.name}):`
        : state.lang === 'zh'
          ? `将滤镜写入槽位 C-${slot}：`
          : `Write filter to slot C-${slot}:`;

    els.repPresetSelect.textContent = '';
    for (const item of state.library) {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${state.lang === 'zh' ? item.name : item.nameEn} [${item.cameraName}]`;
      els.repPresetSelect.appendChild(opt);
    }
    if (state.activeLibId && state.library.some((x) => x.id === state.activeLibId)) {
      els.repPresetSelect.value = state.activeLibId;
    }
    const selItem = state.library.find((x) => x.id === els.repPresetSelect.value) || state.library[0];
    els.repNameInput.value = selItem ? selItem.cameraName : '';
    els.replaceModal.hidden = false;
  }

  function handleExportNp3Zip() {
    const limit = getActiveLimit();
    const list = [];
    for (let s = 10; s <= limit; s++) {
      const idx = state.currentBank * 64 + (s - 1);
      if (state.store.used[idx] && state.store.records[idx]) {
        const info = SC.readRecordInfo(state.store.records[idx]);
        list.push({ slot: s, name: info.name || `Slot ${s}`, np3: SC.slotRecordToNp3(state.store.records[idx]) });
      }
    }
    const source =
      list.length > 0
        ? list
        : getFilteredLibrary().map((x, idx) => ({ slot: 10 + idx, name: x.cameraName, np3: x.np3 }));

    if (!source.length) {
      setStatus(state.lang === 'zh' ? '没有可导出的滤镜。' : 'Nothing to export.', 'error');
      return;
    }

    const entries = [];
    const mapLines = ['Nikon Custom Picture Control (.NP3)', '===================================', ''];
    source.slice(0, 99).forEach((item, i) => {
      const file = `NIKON/CUSTOMPC/PICCON${String(i + 1).padStart(2, '0')}.NP3`;
      entries.push({ name: file, data: item.np3 });
      mapLines.push(`C-${item.slot} -> ${file} (${item.name})`);
    });
    entries.push({ name: 'SLOT-MAP.txt', data: mapLines.join('\r\n') + '\r\n' });
    downloadBlob(Z8Zip.createZip(entries), 'Nikon-CustomPC-NP3-Pack.zip', 'application/zip');
    setStatus(
      state.lang === 'zh'
        ? `已导出 ${Math.min(99, source.length)} 个独立 .NP3 文件 (Nikon-CustomPC-NP3-Pack.zip)`
        : `Exported ${Math.min(99, source.length)} .NP3 files`,
      'ok'
    );
  }

  // -------------------------------------------------------------------------
  // Event Wiring & Init
  // -------------------------------------------------------------------------
  function bindEvents() {
    els.btnOpenCard.addEventListener('click', handleOpenCardClick);
    els.btnSaveCard.addEventListener('click', handleSaveOrReloadCard);

    els.cardDirInput.addEventListener('change', async () => {
      if (!els.cardDirInput.files || !els.cardDirInput.files.length) return;
      try {
        await loadRecFilesList(els.cardDirInput.files);
      } catch (err) {
        setStatus(err.message || String(err), 'error');
      } finally {
        els.cardDirInput.value = '';
      }
    });

    els.langZh.addEventListener('click', () => {
      state.lang = 'zh';
      renderAll();
    });
    els.langEn.addEventListener('click', () => {
      state.lang = 'en';
      renderAll();
    });

    els.tabBank0.addEventListener('click', () => {
      state.currentBank = 0;
      state.renamingSlot = null;
      renderAll();
    });
    els.tabBank1.addEventListener('click', () => {
      state.currentBank = 1;
      state.renamingSlot = null;
      renderAll();
    });

    [els.sfAll, els.sfOcc, els.sfEmp].forEach((btn) => {
      btn.addEventListener('click', () => {
        state.slotFilter = btn.getAttribute('data-sfilter') || 'all';
        renderToolbarAndFooter();
        renderSlotGrid();
      });
    });

    els.slotLimitSelect.addEventListener('change', async () => {
      const nextLim = parseInt(els.slotLimitSelect.value, 10);
      SC.setSlotLimit(state.store, nextLim);
      await persistAfterMutation(state.lang === 'zh' ? `已切换上限为 C-${nextLim}` : `Switched capacity to C-${nextLim}`);
    });

    els.btnQuickFill50.addEventListener('click', handleQuickFill50);
    els.btnImportFolder.addEventListener('click', handleImportFolderClick);

    els.slotFilesInput.addEventListener('change', async () => {
      if (!els.slotFilesInput.files || !els.slotFilesInput.files.length) return;
      const files = Array.from(els.slotFilesInput.files);
      els.slotFilesInput.value = '';
      await importBatchFilesIntoSlots(files, null);
    });

    els.importFolderInput.addEventListener('change', async () => {
      if (!els.importFolderInput.files || !els.importFolderInput.files.length) return;
      const files = Array.from(els.importFolderInput.files);
      els.importFolderInput.value = '';
      await importBatchFilesIntoSlots(files, null);
    });

    // Whole left panel drag-and-drop for multiple .NP3 / .cube / .zip files or folders
    els.slotsPanel.addEventListener('dragover', (e) => {
      const types = Array.from((e.dataTransfer && e.dataTransfer.types) || []);
      if (types.includes('Files')) {
        e.preventDefault();
        els.slotsPanel.classList.add('panel-drag');
      }
    });
    els.slotsPanel.addEventListener('dragleave', (e) => {
      if (!e.relatedTarget || (els.slotsPanel.contains && !els.slotsPanel.contains(e.relatedTarget))) {
        els.slotsPanel.classList.remove('panel-drag');
      }
    });
    els.slotsPanel.addEventListener('drop', async (e) => {
      els.slotsPanel.classList.remove('panel-drag');
      if (!e.dataTransfer) return;
      if (e.dataTransfer.getData('text/x-z8-slot') || e.dataTransfer.getData('text/x-z8-preset')) return;
      e.preventDefault();
      const dropped = await collectFilesFromDataTransfer(e.dataTransfer);
      if (dropped.length) await importBatchFilesIntoSlots(dropped, null);
    });

    els.btnClearAllExt.addEventListener('click', () => {
      const limit = getActiveLimit();
      const occ = [];
      for (let s = 10; s <= limit; s++) if (getSlotRecordInfo(s).valid) occ.push(s);
      if (!occ.length) return;
      if (!state.clearAllArmed) {
        state.clearAllArmed = true;
        clearTimeout(state.clearAllTimer);
        state.clearAllTimer = setTimeout(() => {
          state.clearAllArmed = false;
          renderToolbarAndFooter();
        }, 3000);
        renderToolbarAndFooter();
        return;
      }
      state.clearAllArmed = false;
      clearTimeout(state.clearAllTimer);
      handleDeleteSlots(occ);
    });

    // Library events
    els.libGroupSelect.addEventListener('change', () => {
      state.libGroup = els.libGroupSelect.value;
      renderLibraryList();
    });
    els.libSearch.addEventListener('input', () => {
      state.libQuery = els.libSearch.value;
      renderLibraryList();
    });
    els.btnFillFilteredEmpty.addEventListener('click', handleFillFilteredToEmpty);
    els.btnExportNp3Zip.addEventListener('click', handleExportNp3Zip);

    els.libDrop.addEventListener('dragover', (e) => {
      e.preventDefault();
      els.libDrop.classList.add('drag');
    });
    els.libDrop.addEventListener('dragleave', () => els.libDrop.classList.remove('drag'));
    els.libDrop.addEventListener('drop', async (e) => {
      e.preventDefault();
      els.libDrop.classList.remove('drag');
      if (!e.dataTransfer) return;
      const dropped = await collectFilesFromDataTransfer(e.dataTransfer);
      if (dropped.length) await importBatchFilesIntoLibrary(dropped);
    });

    els.libFileInput.addEventListener('change', async () => {
      if (!els.libFileInput.files || !els.libFileInput.files.length) return;
      const files = Array.from(els.libFileInput.files);
      els.libFileInput.value = '';
      await importBatchFilesIntoLibrary(files);
    });

    els.singleSlotFileInput.addEventListener('change', async () => {
      const target = state.singleFileTargetSlot;
      if (!target || !els.singleSlotFileInput.files || !els.singleSlotFileInput.files.length) return;
      const file = els.singleSlotFileInput.files[0];
      els.singleSlotFileInput.value = '';
      els.replaceModal.hidden = true;
      try {
        const { items: parsed } = await parseLocalFilterFiles([file]);
        addItemsToLibrary(parsed);
        await writeItemsToSlots([{ slot: target, name: parsed[0].cameraName, np3: parsed[0].np3 }], `C-${target} ← ${parsed[0].cameraName}`);
      } catch (err) {
        finishProgress(false);
        setStatus(err.message || String(err), 'error');
      }
    });

    // Transfer modal
    els.btnModalCancel.addEventListener('click', () => (els.transferModal.hidden = true));
    els.transferModal.addEventListener('click', (e) => {
      if (e.target === els.transferModal) els.transferModal.hidden = true;
    });
    els.btnModalConfirm.addEventListener('click', async () => {
      const from = state.transferFromSlot;
      const to = parseInt(els.modalTargetSlot.value, 10);
      const mode = els.modalMode.value;
      els.transferModal.hidden = true;
      if (from && to) await handleTransferSlot(from, to, mode);
    });

    // Replace / Insert modal
    els.repPresetSelect.addEventListener('change', () => {
      const item = state.library.find((x) => x.id === els.repPresetSelect.value);
      if (item) els.repNameInput.value = item.cameraName;
    });
    els.btnRepLocalFile.addEventListener('click', () => {
      state.singleFileTargetSlot = state.replaceTargetSlot;
      els.singleSlotFileInput.value = '';
      els.singleSlotFileInput.click();
    });
    els.btnRepCancel.addEventListener('click', () => (els.replaceModal.hidden = true));
    els.replaceModal.addEventListener('click', (e) => {
      if (e.target === els.replaceModal) els.replaceModal.hidden = true;
    });
    els.btnRepConfirm.addEventListener('click', async () => {
      const slot = state.replaceTargetSlot;
      const item = state.library.find((x) => x.id === els.repPresetSelect.value);
      if (!slot || !item) return;
      let cleanName;
      try {
        cleanName = SC.validateAsciiCameraName(els.repNameInput.value || item.cameraName);
      } catch (err) {
        setStatus(err.message, 'error');
        return;
      }
      els.replaceModal.hidden = true;
      await writeItemsToSlots([{ slot, name: cleanName, np3: item.np3 }], `C-${slot} ← ${cleanName}`);
    });
  }

  function init() {
    bindEvents();
    setStatus(t('initHint'));
    renderAll();
  }

  init();
})();
</script>
